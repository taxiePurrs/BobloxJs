<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>BOBLOX: JAVASCRIPT EDITION</title>
    <style>
        :root {
            --cursor1: default;
            --cursor2: pointer;
            --blur: none;
        }

        .br {
            /* bottom right */
            right: 0px;
            bottom: 0px;
        }

        .chatmessage {
            color: white;
            font-family: Arial;
            white-space: normal;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .join-lobby-btn {
            padding: 4px 10px;
            background: #00BCD4;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: var(--cursor2);
            font-family: monospace;
        }

        #escapemenu {
            position: inherit;
            width: 66.666%;
            height: 77.777%;
            background-color: #0009;
            display: none;
            left: 16.666%;
            top: 11.111%;
            backdrop-filter: var(--blur);
            border-radius: 7.8125% / 11.904761904%;
        }

        #leave {
            left: 3.90625%;
        }

        #leave span {
            font-size: 50cqh;
            font-family: Arial;
        }

        #resume {
            right: 3.90625%;
        }

        #resume span {
            font-size: 50cqh;
            font-family: Arial;
        }

        .escapebtn:hover {
            background-color: #09f9;
            cursor: var(--cursor2);
        }

        .escapebtn {
            position: inherit;
            width: 42.1875%;
            height: 11.904761904%;
            border-radius: 9999px;
            bottom: 5.952380952%;
            background-color: #9999;
            color: white;
            container-type: size;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: var(--cursor1);
        }

        #chatsendcontainer {
            height: 13.888%;
            aspect-ratio: 1 / 1;
            position: inherit;
            border-radius: 9999px;
            background-color: #9999;
        }

        #chatsendbtn {
            position: inherit;
            height: 100%;
            width: 100%;
            transform: scale(0.6);

            background-repeat: no-repeat;
            background-size: 1266% 300%;
            background-position: 0% 0%;
        }

        #chatsendcontainer:hover {
            background-color: #09f9;
            cursor: var(--cursor2);

        }

        #chatinput {
            box-sizing: border-box;
            padding-inline-start: 2.0833%;
            padding-inline-end: 10.4166%;
            position: inherit;
            border-radius: 1000px;
            bottom: 0px;
            left: 0px;
            width: 100%;
            height: 13.888%;
            outline-style: none;
            border-style: none;
            background-color: #2229;
            color: #FFF;
        }

        #chatCountainer {
            background-color: #0009;
            backdrop-filter: var(--blur);
            position: inherit;
            display: none;
            border-radius: 5.21% / 6.94%;
            left: 0.520833333%;
            top: 6.48148%;
            width: 25%;
            height: 33.333%;
        }

        #ChatBox {
            box-sizing: border-box;
            margin: 5px;
            padding-bottom: 0px;
            background-color: transparent;
            position: inherit;
            left: 0px;
            top: 0px;
            width: 100%;
            height: 86.111%;
            border-radius: 5.21% 5.21% 0% 0% / 8.06% 8.06% 0% 0%;
            cursor: var(--cursor1);
        }

        .canvas {
            width: 100vw;
            height: 56.25vw;
            /* 9/16 * 100 */
            max-height: 100vh;
            max-width: 177.78vh;
            /* 16/9 * 100 */
            background-color: black;
        }

        #canvas:focus {
            outline: none;
        }

        #canvascontainer {
            margin: auto;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            display: block;
        }

        #repos {
            width: 50%;
            height: 50%;
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background-color: #444;
            display: none;
            grid-template-rows: 10% 90%;
        }

        #RepoInput {
            display: grid;
            grid-template-columns: 85% 15%;
            width: 100%;
            height: 100%;
        }

        #repoin {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            box-sizing: border-box;
            outline-style: none;
            border-style: none;
            background-color: #222;
            color: #FFF;
            height: 100%;
            padding: 8px 8px;
        }

        #repoadd {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            transition: background-color 0.2s, color 0.2s, transform 0.2s;
            outline-style: none;
            border-style: none;
            height: 100%;
            padding: 0px;
            color: #FFF;
            background-color: #222;
            justify-content: center;
        }

        #repoadd:hover {
            transform: scale(1.08);
            color: #000;
            background-color: #77ff51;
            cursor: var(--cursor2);
        }

        #repoadd:active {
            transform: scale(0.92);
        }


        #repolist {
            overflow-y: auto;
            display: block;
        }

        #templateRepo {
            display: none;
        }

        .activerepo {
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 85% 15%;
            width: 100%;
            height: 11.111%;
        }

        .activerepo:nth-child(even) {
            background-color: #2a2a2a;
        }

        .activerepo:nth-child(odd) {
            background-color: #333333;
        }

        .reporemove {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            transition: background-color 0.2s, color 0.2s, transform 0.2s;
            outline-style: none;
            border-style: none;
            height: 100%;
            padding: 0px;
            color: #FFF;
            background-color: #222;
            justify-content: center;
            position: relative;
        }

        .reporemove:hover {
            transform: scale(1.08);
            color: #000;
            background-color: #ff5151;
            cursor: var(--cursor2);
        }

        .reporemove:active {
            transform: scale(0.92);
        }

        .repoLink {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            text-decoration: underline;
            /*box-sizing: border-box;*/
            color: #FFF;
            padding-left: 8px;
            padding-top: auto;
            padding-bottom: auto;
            align-content: center;
            height: 100%;
            width: 100%;
        }

        a:hover {
            cursor: var(--cursor2);
        }
    </style>
</head>

    <script>
        (function () {

            const screenConsole = document.getElementById('game-console'); //fetch the gui console 

            //define the original outputs for the cosole
            const originalLog = console.log;
            const originalWarn = console.warn;
            const originalError = console.error;


            function safePrintToScreen(messageArray, color = "#4CAF50") {
                try {
                    if (!screenConsole) return;

                    // Convert arguments to safe strings. 
                    // If someone passes a circular object or an invalid variable, this prevents a crash.
                    let parsedMessage = messageArray.map(arg => {
                        if (typeof arg === 'object' && arg !== null) {
                            try {
                                return JSON.stringify(arg); // Convert object to text safely
                            } catch (e) {
                                return "[Unprintable Complex Object]";
                            }
                        }
                        return String(arg); // Convert numbers/strings safely
                    }).join(' ');

                    // Remove formatting flags so they don't break the HTML layout
                    const cleanMessage = parsedMessage.replace(/%c/g, '');

                    // Safely update the HTML
                    screenConsole.innerHTML += `<div style="color: ${color}">> ${cleanMessage}</div>`;
                    screenConsole.scrollTop = screenConsole.scrollHeight; // Keep scrolled to bottom
                } catch (fatalConsoleError) {
                    // If the screen logger itself breaks, do absolutely nothing.
                    // This prevents a logger error from ever crashing your actual game loop.
                }
            }

            // 1. Intercept Standard Uncaught Errors (e.g., "variable is not defined")
            window.addEventListener("error", (event) => {
                // Format a clean, human-readable error log for the gui console
                const cleanErrorMsg = `[CRASH AVOIDED] Line ${event.lineno}: ${event.message}`;

                if (typeof console.error === 'function') {
                    console.error(cleanErrorMsg);
                }

                // Returning TRUE stops the browser from throwing a fatal crash
                return true;
            });

            // 2. Intercept Broken Asynchronous Promises (e.g., Network/PeerJS timeouts)
            window.onunhandledrejection = function (event) {
                const cleanRejectMsg = `[ASYNC CRASH AVOIDED]: ${event.reason}`;

                if (typeof console.error === 'function') {
                    console.error(cleanRejectMsg);
                }

                // Prevent the default browser console thread crash sequence
                event.preventDefault();
            };


            // Overwrite the console channels with protected wrappers
            console.log = function (...args) {
                originalLog.apply(console, args); // Still print to real hidden console
                safePrintToScreen(args, "#4CAF50");
            };

            console.warn = function (...args) {
                originalWarn.apply(console, args); // Still warn to real hidden console
                safePrintToScreen(args, "#FF9800");
            };

            console.error = function (...args) {
                originalError.apply(console, args); // Guess what this does
                safePrintToScreen(args, "#FF5252");
            };
        })();

    </script>


    <script id="engineapi">
        window.canvas = document.getElementById("canvas")
        window.ctx = window.canvas.getContext('2d');

        window.gameconfig = { //this is the default config
            HeadCol: "#fe0",        // Head Color, im unsure if it supports full lenght hexadecimal color
            LArmCol: "#fe0",        // Left Arm Color
            RArmCol: "#fe0",        // Right Arm Color
            TorsoCol: "#46f",       // Torso Color
            LLegCol: "#3c0",        // Left Leg Color
            RLegCol: "#3c0",        // Right Leg Color
            Face: "Happy",          // Prefered face
            ShowFPS: true,          // Show the fps, i should probably merge this into the debug option
            Debug: true,            // Unused lol
            Name: "Guest",          // Preffered name
            BackgroundBlur: true,   // Toggle background blur
            Bobux: 0,               // Bobux
        };

        window.loadData = function (obj) {
            for (const key in obj) {
                if (Object.prototype.hasOwnProperty.call(obj, key)) {
                    const rawValue = localStorage.getItem(key);
                    if (rawValue !== null) {
                        try {
                            // Tries to parse booleans ("false"), numbers ("42"), or valid JSON strings ('"Guest"')
                            obj[key] = JSON.parse(rawValue);

                        } catch (error) {
                            // If parsing fails (like on raw "Guest"), treat it as a normal string
                            obj[key] = rawValue;
                        }
                    }
                }
            }
        }

        loadData(gameconfig)

        window.keysdown = new Set();

        window.addEventListener("keydown", (event) => window.keysdown.add(event.key));
        window.addEventListener("keyup", (event) => window.keysdown.delete(event.key));

        window.saveConfigValue = function (key, value) { // Save a config key to localstorage for future loading
            localStorage.setItem(key, value);
        }

        window.saveTable = function (obj) {
            for (const [key, item] of Object.entries(obj)) {
                saveConfigValue(key, item)
            }
        }

        window.clamp = function (value, min, max) { // Mimicks the python Math.clamp function
            return Math.max(min, Math.min(value, max));
        }

        window.drawRectangle = function (X, Y, Width, Height, Color) {
            window.ctx.fillStyle = Color
            window.ctx.fillRect(X, Y, Width, Height)
        }

        window.drawRoundedRectangle = function (X, Y, Width, Height, Radius, Color) {
            window.ctx.fillStyle = Color;
            window.ctx.beginPath();
            window.ctx.roundRect(X, Y, Width, Height, Radius);
            window.ctx.fill();
        }

        window.drawRotatedRectangle = function (X, Y, Width, Height, Degrees, Color) {
            window.ctx.fillStyle = Color;
            window.ctx.save();

            // Move grid origin to the center of where the rectangle should be
            window.ctx.translate(X + Width / 2, Y + Height / 2);

            // Rotate the grid
            window.ctx.rotate((Degrees * Math.PI) / 180);

            // Draw the rectangle centered on the new origin
            window.ctx.fillRect(-Width / 2, -Height / 2, Width, Height);

            window.ctx.restore();
        }

        window.drawRotatedRoundedRectangle = function (X, Y, Width, Height, Radius, Degrees, Color) {
            window.ctx.fillStyle = Color;
            window.ctx.save();

            window.ctx.translate(X + Width / 2, Y + Height / 2);
            window.ctx.rotate((Degrees * Math.PI) / 180);

            window.ctx.beginPath();
            window.ctx.roundRect(-Width / 2, -Height / 2, Width, Height, Radius);
            window.ctx.fill();

            window.ctx.restore();
        }

        window.drawRotatedImage = function (image, X, Y, Scale, Degrees) {
            // 1. Skip if the image hasn't fully loaded from the disk yet
            if (image.naturalWidth === 0) return;

            // 2. Calculate the scaled dimensions
            const width = image.naturalWidth * Scale;
            const height = image.naturalHeight * Scale;

            window.ctx.save();

            // 3. Move the grid origin to the center of the image location
            window.ctx.translate(X + width / 2, Y + height / 2);

            // 4. Rotate the grid (Degrees to Radians)
            window.ctx.rotate((Degrees * Math.PI) / 180);

            // 5. Draw the image centered on the new origin using negative half-sizes
            window.ctx.drawImage(image, -width / 2, -height / 2, width, height);

            window.ctx.restore();
        }

        window.drawSpriteSheet = function (img, cx, cy, sx, sy, w, h) {
            try {
                window.ctx.drawImage(img, sx, sy, w, h, cx, cy, w, h);
            } catch (error) {
                return
            }
        }

        window.drawPolygon = function (FillColor, StrokeColor, StrokeWidth, ...points) { // x and y are individual points, only loop through half!!!
            if (points.length % 2 === 0) {
                if (points.length >= 6) {
                    window.ctx.beginPath();
                    for (let i = 0; i < points.length; i += 2) {
                        if (i === 0) {
                            window.ctx.moveTo(points[i], points[i + 1]);
                        } else {
                            window.ctx.lineTo(points[i], points[i + 1]);
                        }
                    }
                    window.ctx.closePath();
                    if (FillColor !== null) {
                        window.ctx.fillStyle = FillColor;
                        window.ctx.fill();
                    }
                    if (StrokeWidth !== 0) {
                        window.ctx.lineWidth = StrokeWidth;
                        window.ctx.strokeStyle = StrokeColor;
                        window.ctx.stroke();
                    }
                } else {
                    warn("Less than 6 points proivded!!!")
                }
            } else {
                warn("Odd number of polygon points arguments!!!")
            }
        }

        window.drawComplexImage = function (image, X, Y, Scale, Degrees, MirrorX) {
            if (image.naturalWidth === 0) return;

            const width = image.naturalWidth * Scale;
            const height = image.naturalHeight * Scale;

            window.ctx.save();
            window.ctx.translate(X + width / 2, Y + height / 2);

            // 1. Handle mirroring first
            const flipX = MirrorX ? -1 : 1;
            window.ctx.scale(flipX, 1);

            // 2. Handle rotation second (Invert degrees if mirrored so it rotates the correct direction)
            window.ctx.rotate(((Degrees * flipX) * Math.PI) / 180);

            window.ctx.drawImage(image, -width / 2, -height / 2, width, height);

            window.ctx.restore();
        }

        var mousex = 0, mousey = 0, mouseOnScreen = false, MouseHover = null

        canvas.addEventListener('mousemove', (event) => {
            const rect = canvas.getBoundingClientRect();

            // Get the 0-1 ratio and clamp it
            let xRatio = window.clamp((event.clientX - rect.left) / rect.width, 0, 1);
            let yRatio = window.clamp((event.clientY - rect.top) / rect.height, 0, 1);

            // Assign the calculated pixel integers to your existing variables
            window.mousex = Math.floor(xRatio * canvas.width);
            window.mousey = Math.floor(yRatio * canvas.height);
        });


        window.mouseHitbox = function (X, Y, Width, Height, ID) {
            if (window.mousex > X && window.mousex < X + Width && window.mousey > Y && window.mousey < Y + Height) {
                MouseHover = ID
            }
        }
        window.circularMouseHitbox = function (X, Y, Radius, ID) {
            if (Math.hypot(X - window.mousex, Y - window.mousey) <= Radius) {
                MouseHover = ID
            }
        }

        window.drawText = function (Text, X, Y, Size, Font, Color, Alignment) {
            window.ctx.fillStyle = Color;
            window.ctx.font = `${Size}px ${Font}`;
            window.ctx.textAlign = Alignment || "left"; // Options: "left", "center", "right"
            window.ctx.textBaseline = "middle";         // Centers text vertically on the Y anchor
            window.ctx.fillText(Text, X, Y);
        }



        window.abbreviateToMoney = function (num) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                notation: 'compact',
                compactDisplay: 'short',
                maximumFractionDigits: 1
            }).format(Math.floor(num));
        }

        window.checkTextWidth = function (Text, Font, Size) {
            window.ctx.font = `${Size}px ${Font}`
            return window.ctx.measureText(Text).width
        }

        window.calculateTextSize = function (Text, Width, Height, Font, CachedSize = 50) {
            let size = CachedSize
            if (window.checkTextWidth(Text, Font, size) > Width || size > Height) {
                while (window.checkTextWidth(Text, Font, size) > Width || size > Height) {
                    size -= 1
                }
            } else {
                while (window.checkTextWidth(Text, Font, size) < Width && size <= Height) {
                    size += 1
                }
                size -= 1
            }

            return size
        }

        window.drawBoundedText = function (Text, X, Y, Width, Height, Font, Color, Alignment = "center", CachedSize = 40) {
            const calcsize = calculateTextSize(Text, Width, Height, Font, CachedSize)
            window.ctx.fillStyle = Color;
            window.ctx.font = `${calcsize}px ${Font}`;
            window.ctx.textAlign = Alignment;           // Options: "left", "center", "right"
            window.ctx.textBaseline = "middle";         // Centers text vertically on the Y anchor
            window.ctx.fillText(Text, X, Y);
            return calcsize
        }

        window.DarkenHex = function (hex) {
            let cleanHex = hex.replace('#', '');
            let isShort = cleanHex.length === 3;

            if (isShort) {
                // Subtract 2 from each shorthand hex digit (approx. 32 in 8-bit)
                return '#' + Array.from(cleanHex).map(char => {
                    let val = parseInt(char, 16);
                    return Math.max(0, val - 2).toString(16);
                }).join('');
            } else {
                // Process standard 6-digit hex
                let r = parseInt(cleanHex.substring(0, 2), 16);
                let g = parseInt(cleanHex.substring(2, 4), 16);
                let b = parseInt(cleanHex.substring(4, 6), 16);

                r = Math.max(0, r - 32).toString(16).padStart(2, '0');
                g = Math.max(0, g - 32).toString(16).padStart(2, '0');
                b = Math.max(0, b - 32).toString(16).padStart(2, '0');

                return `#${r}${g}${b}`;
            }
        }

        window.readBit = function (bin, bit) {
            const str = String(bin)                     // stringify the binary number
            let data = str.charAt(str.length - bit - 1) // get the rightmost number in the binary and shift to left by variable bit
            return (data === "1")                       // is data equal to 1 
        }

        window.setBit = function (bin, bit, val) {
            let str = String(bin)
            str = "0".repeat(Math.max(bit - str.length + 1, 0)) + str // 0th index, 1 length, add 5, 5th index 6 length
            return str.split("").with(-(bit + 1), String(val)).join("");
        }

        window.inRange = function (number, min, max) {

        window.watchForClassChange = function (elementId, targetClass, callback, disconnectOnTrigger = false) {
            const targetElement = document.getElementById(elementId);
            if (!targetElement) return null;

            // Track whether the class was already present in the previous check
            let wasClassPresent = targetElement.classList.contains(targetClass);

            const observerCallback = (mutationsList, observerInstance) => {
                for (const mutation of mutationsList) {
                    if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                        // Use classList for cleaner and faster lookups
                        const isClassPresent = targetElement.classList.contains(targetClass);

                        // Only trigger if it wasn't there before, but is there now
                        if (isClassPresent && !wasClassPresent) {
                            callback(targetElement);

                            if (disconnectOnTrigger) {
                                observerInstance.disconnect();
                                return; // Exit early since we are done listening
                            }
                        }

                        // Update the state cache for the next mutation event
                        wasClassPresent = isClassPresent;
                    }
                }
            };

            const observer = new MutationObserver(observerCallback);

            observer.observe(targetElement, {
                attributes: true,
                attributeFilter: ['class']
            });

            return observer;
        };


        window.cloneWithEditableChildren = function (elementId) {
            const original = document.getElementById(elementId);
            if (!original) return [];

            // 1. Perform a deep clone of the parent element and all descendants
            const cloneParent = original.cloneNode(true);

            // 2. Gather all child elements inside the clone into a flat, editable array
            // We use the spread operator [...] to turn the NodeList into a true Array
            const editableNodesList = [cloneParent, ...cloneParent.querySelectorAll("*")];

            // 3. Return the array of live, unmounted element pointers
            return editableNodesList;
        };

            // Skip network request immediately if the browser is completely offline
            if (navigator.onLine === false) {
                console.warn("Browser is offline. Skipping asset download.");
                return Promise.resolve(false);
            }

            // Return the promise pipeline so you can track when the download completes
            return fetch(imageUrl)
                .then((response) => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.blob(); // Pass the raw binary image data to the next .then()
                })
                .then((imageBlob) => {
                    // Open a write transaction to IndexedDB
                    const transaction = gameStorageDB.transaction(["gameFiles"], "readwrite");
                    const store = transaction.objectStore("gameFiles");

                    // Store the binary image blob directly into your data structure
                    store.put({ url: imageUrl, code: imageBlob, savedAt: Date.now() });

                    // Return a promise that resolves true once written to the hard drive
                    return new Promise((resolve) => {
                        transaction.oncomplete = () => {
                            console.log(`Asset successfully cached offline: ${imageUrl}`);
                            resolve(true);
                        };
                    });
                })
                .catch((error) => {
                    // Gracefully catch offline failures, CORS blocking, or disk space errors
                    console.error("Failed to store asset:", error);
                    return false;
                });

        function saveScriptToStorage(url) {
            // Check if browser is offline to skip network overhead entirely
            if (navigator.onLine === false) {
                console.warn("Browser is offline. Skipping update download.");
                return Promise.resolve(false);
            }

            // Return the overall promise chain so you can still track success if you want to
            return fetch(url)
                .then((response) => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.text(); // Passes raw text down to the next .then()
                })
                .then((rawCodeText) => {
                    // Open a write transaction to IndexedDB
                    const transaction = gameStorageDB.transaction(["gameFiles"], "readwrite");
                    const store = transaction.objectStore("gameFiles");

                    // Save the data payload
                    store.put({ url: url, code: rawCodeText, savedAt: Date.now() });

                    // Wait for the IndexedDB disk write to finish successfully
                    return new Promise((resolve) => {
                        transaction.oncomplete = () => {
                            console.log(`Successfully cached: ${url}`);
                            resolve(true);
                        };
                    });
                })
                .catch((error) => {
                    // Catches network disconnects, CORS blocks, or database crashes gracefully
                    console.error("Failed to store the script:", error);
                    return false;
                });
        }


        function loadSavedImage(url, callback) {
            const transaction = gameStorageDB.transaction(["gameFiles"], "readonly");
            const store = transaction.objectStore("gameFiles");
            const getRequest = store.get(url);

            getRequest.onsuccess = () => {
                const fileRecord = getRequest.result;

                if (fileRecord && fileRecord.code) {
                    // Convert the binary database blob into a local string URL
                    const localUrl = URL.createObjectURL(fileRecord.code);
                    if (typeof callback === "function") callback(localUrl);
                } else {
                    console.warn(`Asset missing from offline database cache: ${url}`);
                    // Fallback to network directly if database is empty
                    if (typeof callback === "function") callback(url);
                }
            };
        }

        function loadScriptFromStorage(url, callback) {
            const transaction = gameStorageDB.transaction(["gameFiles"], "readonly");
            const store = transaction.objectStore("gameFiles");
            const getRequest = store.get(url);

            getRequest.onsuccess = () => {
                const fileRecord = getRequest.result;

                if (fileRecord && fileRecord.code) {
                    // 1. Create a brand new script element every single time
                    const script = document.createElement("script");
                    script.id = url
                    // 2. Inject the code text
                    script.textContent = fileRecord.code;

                    // 3. Append it to the head tag (old scripts remain untouched)
                    document.head.appendChild(script);


                    console.log(`Successfully appended new script element for: ${url}`);
                    if (typeof callback === "function") callback();
                } else {
                    console.warn("File not found in storage.");
                }
            };

            } else {
                // --- CASE 2: LOCAL FILEPATH ---
                console.log(`Detected local file path: ${currentUrl}. Skipping network storage pipeline.`);

    <script>
            // this is extracted code from CloudLink Delta https://github.com/cloudlink-delta
            (function () {
                // 1. Establish the fallback layer instantly to protect the game loop
                class FallbackOfflineLink {
                    constructor() {
                        this.isOnline = false;
                        console.log("[Engine Cloud] Initialized in Local Offline Mode.");
                    }
                    broadcast() { /* Drops outbound network ticks silently when offline */ }
                    connectToPeer() { console.warn("Network unavailable. Cannot link players."); return null; }
                }

                // Assign baseline safety net variable immediately
                window.cldelta = new FallbackOfflineLink();

                // Integrated official v1.5.5 script link priority array
                const PEERJS_SOURCES = [
                    'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js',
                    'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js'
                ];

                // 2. Real networking controller executed only if a library path resolves completely
                class CloudLinkDeltaStandalone {
                    constructor() {
                        this.peer = null;
                        this.name = '';
                        this.dataConnections = new Map();
                        this.newestConnected = '';
                        this.lastDisconnected = '';
                        this.peerStatus = 'idle';
                        this.verboseLogs = false;

                        // Extracted official cloud signaling architecture parameters
                        this.sessionServer = {
                            host: 'peerjs.mikedev101.cc',
                            port: 443,
                            secure: true,
                            path: '/',
                            key: 'peerjs',
                            config: {
                                iceTransportPolicy: 'all',
                                iceServers: [
                                    // Safe, globally whitelisted STUN servers that school filters never block
                                    { urls: 'stun:google.com' },
                                    { urls: 'stun:google.com' },
                                    { urls: 'stun:google.com' },
                                    { urls: 'stun:cloudflare.com' }
                                ]
                            }
                        };


                        this.gmsg_state = new Map(); // Global Message state
                        this.pmsg_state = new Map(); // Private Message state
                    }

                    connect(username) {
                        if (!username || username.trim() === "") {
                            console.error("[CLΔ Standalone] Username cannot be empty.");
                            return;
                        }
                        this.peerStatus = 'connecting';
                        this.name = username.trim();

                        try {
                            this.peer = new Peer(this.name, {
                                host: this.sessionServer.host,
                                port: this.sessionServer.port,
                                secure: this.sessionServer.secure,
                                path: this.sessionServer.path,
                                key: this.sessionServer.key,
                                config: this.sessionServer.config,
                                debug: this.verboseLogs ? 3 : 1
                            });
                            this.attachSignalHandlers();
                        } catch (e) {
                            this.peerStatus = 'error';
                            console.error("[CLΔ Standalone] Instantiation step failed:", e);
                        }
                    }

                    attachSignalHandlers() {
                        this.peer.on('open', (id) => {
                            this.peerStatus = 'open';
                            this.isOnline = true;
                            console.log(`%c[CLΔ Engine] Connected to matchmaker! Player Session ID: ${id}`);
                            if (typeof window.onEngineNetworkOpen === 'function') window.onEngineNetworkOpen(id);
                        });

                        this.peer.on('connection', (conn) => {
                            this.dataConnections.set(conn.peer, conn);
                            this.bindConnectionChannels(conn);
                        });

                        this.peer.on('disconnected', () => {
                            this.peerStatus = 'disconnected';
                            this.isOnline = false;
                            console.warn("[CLΔ Engine] Disconnected from signaling nodes.");
                        });

                        this.peer.on('error', (err) => {
                            this.peerStatus = 'error';
                            this.isOnline = false;
                            console.error("[CLΔ Engine] Internal pipeline error:", err);
                        });
                    }

                    bindConnectionChannels(conn) {
                        conn.on('open', () => {
                            this.newestConnected = conn.peer;
                            console.log(`[CLΔ Engine] Target peer linked successfully: ${conn.peer}`);

                            // Perform official CLD Protocol initialization packet broadcast handshake
                            conn.send(JSON.stringify({
                                opcode: 'NEGOTIATE',
                                ttl: 1,
                                payload: { version: { major: 1, minor: 0, patch: 0 }, spec_version: 0 }
                            }));

                            if (typeof window.onPeerLinked === 'function') window.onPeerLinked(conn.peer);
                        });

                        conn.on('data', (raw) => {
                            try {
                                const packet = typeof raw === 'string' ? JSON.parse(raw) : raw;
                                this.routeIncomingProtocol(conn.peer, packet);
                            } catch (err) {
                                console.error("[CLΔ Engine] Error parsing network data packet:", err);
                            }
                        });

                        conn.on('close', () => {
                            this.lastDisconnected = conn.peer;
                            this.dataConnections.delete(conn.peer);
                            console.log(`[CLΔ Engine] Peer dropped connection: ${conn.peer}`);
                            if (typeof window.onPeerDropped === 'function') window.onPeerDropped(conn.peer);
                        });
                    }

                    routeIncomingProtocol(sender, packet) {
                        const { opcode, payload } = packet;

                        switch (opcode) {
                            case 'G_MSG': // Global Network Packet Broadcast updates
                                this.gmsg_state.set('default', payload);
                                if (typeof window.routeIncomingGameData === 'function') {
                                    window.routeIncomingGameData({ type: 'BROADCAST', from: sender, data: payload });
                                }
                                break;

                            case 'P_MSG': // Private Peer targeted messaging frames
                                if (!this.pmsg_state.has(sender)) this.pmsg_state.set(sender, new Map());
                                this.pmsg_state.get(sender).set('default', payload);
                                if (typeof window.routeIncomingGameData === 'function') {
                                    window.routeIncomingGameData({ type: 'PRIVATE', from: sender, data: payload });
                                }
                                break;

                            default:
                                break;
                        }
                    }

                    connectToPeer(targetId) {
                        if (!this.peer || this.peer.destroyed) return null;

                        // Simplifies connection execution loops to protect Chromebook sandboxes
                        const conn = this.peer.connect(targetId);

                        this.dataConnections.set(targetId, conn);
                        this.bindConnectionChannels(conn);
                        return conn;
                    }


                    broadcast(message) {
                        const packet = { opcode: 'G_MSG', origin: this.name, ttl: 1, target: '*', payload: message };
                        for (const [peerId, conn] of this.dataConnections) {
                            if (conn.open) conn.send(JSON.stringify(packet));
                        }
                    }

                    sendPrivate(targetId, message) {
                        const packet = { opcode: 'P_MSG', origin: this.name, ttl: 1, target: targetId, payload: message };
                        const conn = this.dataConnections.get(targetId);
                        if (conn && conn.open) conn.send(JSON.stringify(packet));
                    }
                }

                // 3. Dynamic Sequential Loader Loop matching the original fallback array scheme
                async function loadPeerInfrastructure(index = 0) {
                    if (index >= PEERJS_SOURCES.length) {
                        console.warn("[CLΔ Core Loader] All CDN routes exhausted. Staying in offline sandbox mode.");
                        return;
                    }

                    const scriptUrl = PEERJS_SOURCES[index];
                    const scriptEl = document.createElement('script');

                    // NEW CRITICAL LINE: This tells the browser to unmute the errors for this file!
                    scriptEl.crossOrigin = "anonymous";
                    scriptEl.src = scriptUrl;

                    scriptEl.onload = function () {
                        window.cldelta = new CloudLinkDeltaStandalone();
                        console.log(`[CLΔ Core Loader] Infrastructure bound successfully via index ${index}`);
                    };

                    scriptEl.onerror = function () {
                        console.warn(`[CLΔ Core Loader] Route failed to resolve: ${scriptUrl}. Switching targets...`);
                        loadPeerInfrastructure(index + 1);
                    };

                    document.head.appendChild(scriptEl);
                }


                // Initiate the sequential load process automatically on boot up
                loadPeerInfrastructure(0);
            })();
    </script>

            // Run your existing frame movement tracking loops first

            const packet = payload.data;

            // Intercept automatic lobby routing updates sent by the host
            if (packet.type === "ROOM_SYNC" && !isLobbyHost) {
                console.log("Received room cluster updates from Lobby Host.");

                // Loop through all existing players in the match and bind to them
                packet.peers.forEach(peerId => {

                        window.cldelta.connectToPeer(peerId);

        function ceilingcheck(prevy, newy) {
            let ceil = 0
            for (let i in GameDataLoaded.ceilings) {
                const data = GameDataLoaded.ceilings[i]
                if (data.enabled && inRange(PlrX, data.xstart - 10 * Size + 1, data.xend + 10 * Size - 1) && newy - 100 * Size < data.y && prevy - 100 * Size > data.y) {
                    return data.y
                }
            }
            return 0
        }

        function gameLoop(currentTime) {
            let dt = (currentTime - lastTime) / 1000;
            if (Number.isNaN(dt) || dt > 0.1) dt = 0;
            lastTime = currentTime;

            //set reset hovering id
            MouseHover = null
            let leftrightbias = 0

            animationClock = Math.max(animationClock - dt * ((characterState == "Walking") ? (speed / 50) : 1), 0)

            escapemenuY = window.clamp(escapemenuY, 120, 1080)

            //clear the canvas
            window.ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawRectangle(0, 0, canvas.width, canvas.height, "#111")

            if (prevgame && Currentgame !== prevgame) {
                gameLeave(prevgame)
            }

            //handle Key inputs
            if (Currentgame == null) {
                PlrX = 123
                PlrY = 480
                Size = 3
                facingleft = false
                characterState = "Idle"
                animframe = 0
            } else {
                let canvasfocus = isFocused(canvas)
                if (canvasfocus) {
                    if (keysdown.has("ArrowLeft")) { leftrightbias -= 1 }
                    if (keysdown.has("a")) { leftrightbias -= 1 }
                    if (keysdown.has("ArrowRight")) { leftrightbias += 1 }
                    if (keysdown.has("d")) { leftrightbias += 1 }
                }

                if (leftrightbias > 0) { facingleft = false }
                if (leftrightbias < 0) { facingleft = true }
                if (Currentgame != prevgame) {
                    currentfloor = 0
                    chatBackground.innerHTML = ""
                    //console.log(Currentgame)
                    //console.log(window.games)
                    GameDataLoaded = window.games[Currentgame]
                    //console.log(GameDataLoaded)
                    PlrX = GameDataLoaded.startposx
                    PlrY = GameDataLoaded.startposy
                    yvel = 0
                    Scrollx = 0
                    Size = GameDataLoaded.Size
                }

                prevY = PlrY
                PlrY += yvel * dt
                const ceil = ceilingcheck(prevY, PlrY)
                if (ceil != 0) {
                    yvel *= -0.5
                    PlrY = ceil + 100 * Size
                }

                // get the current floor
                for (let i in GameDataLoaded.floors) {
                    if (!GameDataLoaded.floors[i].enabled) {
                        continue;
                    }
                    const passcheck = (keysdown.has("s") || keysdown.has("ArrowDown"))
                    if (i !== currentfloor) {
                        const data = GameDataLoaded.floors[i]
                        const data2 = GameDataLoaded.floors[currentfloor]

                        if ((!(data.passable && passcheck)) && ((data.y < data2.y) || !inRange(PlrX, data2.xstart - 10 * Size + 1, data2.xend + 10 * Size - 1)) && PlrY - 10 * Size < data.y && inRange(PlrX, data.xstart - 10 * Size + 1, data.xend + 10 * Size - 1)) {
                            currentfloor = (ceilingcheck(prevY, data.y) == 0) ? i : currentfloor
                        }
                    } else {
                        if (GameDataLoaded.floors[currentfloor].passable && passcheck) {
                            currentfloor = 0
                        }
                    }
                }

                if (PlrY >= GameDataLoaded.floors[currentfloor].y && ((!GameDataLoaded.floors[currentfloor].Ladder) || (GameDataLoaded.floors[currentfloor].Ladder && yvel >= 0))) {
                    yvel = 0
                    PlrY = GameDataLoaded.floors[currentfloor].y
                    if (canvasfocus && (keysdown.has("w") || keysdown.has("ArrowUp"))) {
                        yvel = -Size * Math.sqrt(2 * GameDataLoaded.gravity * jumppower)
                        animationClock = 0.1
                        characterState = "Airborne"
                        animframe = 0
                    }
                } else {
                    if (characterState !== "Airborne") {
                        animationClock = 0
                    }
                    characterState = "Airborne"
                    if (animationClock > 0) {
                        animframe = 0
                    } else {
                        animframe = 1
                    }
                    yvel += GameDataLoaded.gravity * Size * dt
                }

                window.ctx.drawImage(GameDataLoaded.Skybox, 0, 0)
                const prevX = PlrX + Scrollx
                let movex = window.clamp(leftrightbias, -1, 1) * dt * speed * Size
                let disttowall = movex

                for (let i in GameDataLoaded.walls) {
                    const data = GameDataLoaded.walls[i]
                    if (data.enabled && inRange(PlrY - 10 * Size, data.ystart /* - 90*Size*/, data.yend + 90 * Size - 1)) {
                        if (prevX <= data.x && movex >= 0) {
                            //console.log(data.x - data.width - prevX - 10*Size)
                            disttowall = Math.min(disttowall, data.x - data.width - prevX - 10 * Size)
                        } else if (prevX > data.x && movex < 0) {
                            //console.log(data.x + data.width - prevX + 10*Size)
                            disttowall = Math.max(disttowall, data.x + data.width - prevX + 10 * Size)
                        }
                    }
                }
                movex = disttowall

                if (GameDataLoaded.width - 1920 - Scrollx <= 0 && leftrightbias > 0) {
                    PlrX += movex
                }
                if (Scrollx <= 0 && leftrightbias < 0) {
                    PlrX += movex
                }
                if (PlrX < 10 * Size) {
                    PlrX = 10 * Size
                    if (PlrY >= GameDataLoaded.floors[currentfloor].y && yvel == 0 || characterState == "Walking") {
                        characterState = "Idle",
                            animframe = 0
                    }
                }
                if (PlrX > 1920 - 10 * Size) {
                    PlrX = 1920 - 10 * Size
                    if (PlrY >= GameDataLoaded.floors[currentfloor].y && yvel == 0 || characterState == "Walking") {
                        characterState = "Idle",
                            animframe = 0
                    }
                }

                if (PlrY >= GameDataLoaded.floors[currentfloor].y && yvel == 0) {
                    if (movex == 0) {
                        characterState = "Idle"
                        animframe = 0
                    } else {
                        if (characterState != "Walking") {
                            animframe = 0
                            animationClock = WalkFrameOrder.length / walkanimspeed
                        }
                        characterState = "Walking"
                        if (animationClock == 0) {
                            animationClock = WalkFrameOrder.length / walkanimspeed
                        }
                        animframe = WalkFrameOrder[WalkFrameOrder.length - 1 - window.clamp(Math.floor(animationClock * walkanimspeed), 0, WalkFrameOrder.length - 1)]
                    }
                }

                window.gameTick(Currentgame, GameDataLoaded, dt, currentTime)
            }
            prevgame = Currentgame

            for (let id in remotePlayers) {
                let p = remotePlayers[id];

                if (Date.now() - p.lastUpdate > 25000) {
                    delete remotePlayers[id];
                    continue;
                }

                if (p.g == Currentgame) {
                    let renderX = p.x + p.sx - Scrollx; // Subtracting the local camera scroll value positions
                    let renderY = p.y;
                    drawCharacter(renderX, renderY, p.s, p.state, p.m)
                }
            }


            //Draw the character
            drawCharacter(PlrX, PlrY, Size, getAnimationFrame(), facingleft)


            if (Currentgame == null) {
                EscapeMenuOpen = false
                escapemenuY = 1080
                //draw the overlaid boblox javascript edition logo
                window.drawSpriteSheet(UISheet, 10, 10, 60, 0, 315, 90)
                mouseHitbox(10, 10, 315, 90, "Logo") //clickbox redirects to github repo

                window.drawSpriteSheet(UISheet, 335, 40, 380, 30, 60, 60)
                mouseHitbox(335, 40, 60, 60, "HomeTab")

                window.drawSpriteSheet(UISheet, 395, 40, 380, 90, 60, 60)
                mouseHitbox(395, 40, 60, 60, "SettingsTab")

                if (menu == 0) {
                    if (repolistopen) {
                        repolist.style.display = "none"
                        repolistopen = false
                    }
                    let icox = 235
                    let icoy = 120
                    for (const [key, item] of Object.entries(games)) {
                        //try {
                        ctx.drawImage(item["icon"], icox, icoy)
                        mouseHitbox(icox, icoy, 240, 240, key)
                        /*} catch (error) {
                            continue
                        }*/

                        icox += 240
                        if (icox > 1680) {
                            icox = 235
                            icoy += 240
                        }
                    }
                } else if (menu == 1) {
                    if (!repolistopen) {
                        repolist.style.display = "grid"
                        repolistopen = true
                    }
                    // toggle background blur
                    window.drawSpriteSheet(UISheet, 235, 120, 0, window.gameconfig.BackgroundBlur ? 60 : 30, 60, 30)
                    mouseHitbox(235, 120, 60, 30, "ToggleBlur")
                    drawText("Enable Ui blur", 295, 135, 30, "Arial", "#fff")

                    // toggle debug settings
                    window.drawSpriteSheet(UISheet, 235, 160, 0, window.gameconfig.Debug ? 60 : 30, 60, 30)
                    mouseHitbox(235, 160, 60, 30, "ToggleDebug")
                    drawText("Debug options", 295, 175, 30, "Arial", "#fff")

                    if (window.gameconfig.Debug) { // check if debug options are enabled
                        //draw fps toggle
                        window.drawSpriteSheet(UISheet, 265, 200, 0, window.gameconfig.ShowFPS ? 60 : 30, 60, 30)
                        mouseHitbox(265, 200, 60, 30, "ToggleFPS")
                        drawText("Show FPS", 325, 215, 30, "Arial", "#fff")
                    }

                    const offset = window.gameconfig.debug ? 40 : 0

                }

                if (chatmenudisplay !== "none") { // check and update if its not set to none
                    chatContainer.style.display = chatmenudisplay = "none"
                }
                if (escapemenudisplay !== "none") { // check and update if its not set to none
                    escapemenu.style.display = escapemenudisplay = "none"
                }
            } else {
                if (repolistopen) {
                    repolist.style.display = "none"
                    repolistopen = false
                }
                if (GameDataLoaded) {
                    window.ctx.drawImage(GameDataLoaded.foreground, 0, 0)
                }

                /*
                ###########
                #INGAME UI#
                ###########
                */
                gameUI(Currentgame)

                if ((chatopen && !EscapeMenuOpen ? "block" : "none" /* gets the target display type */) !== chatmenudisplay) {
                    chatContainer.style.display = chatmenudisplay = chatmenudisplay === "none" ? "block" : "none"; // update if outdated
                }

                //draw the Boblox escape menu button
                circularMouseHitbox(35, 35, 25, "OpenEscape")
                drawRoundedRectangle(10, 10, 50, 50, 25, (MouseHover == "OpenEscape" && !EscapeMenuOpen) ? "#9999" : "#0009")
                window.drawSpriteSheet(UISheet, 20, 20, 30, 0, 30, 30)


                //draw the chat button
                circularMouseHitbox(95, 35, 25, "OpenChat")
                drawRoundedRectangle(70, 10, 50, 50, 25, (MouseHover == "OpenChat" && !EscapeMenuOpen) ? "#9999" : "#0009")
                window.drawSpriteSheet(UISheet, 80, 20, chatopen ? 410 : 380, 0, 30, 30)

                //draw the escape menu
                if ((escapemenuY < 1080 ? "block" : "none" /* gets the target display type */) !== escapemenudisplay) {
                    escapemenu.style.display = escapemenudisplay = escapemenudisplay === "none" ? "block" : "none"; // update if outdated
                }
                if (escapemenuY < 1080) {
                    if (EscapeMenuOpen) {
                        MouseHover = null
                        mouseHitbox((canvas.width - 1280) / 2, escapemenuY, 1280, 840, "EscapeBackground")
                    }
                    escapemenu.style.top = (escapemenuY / canvas.height * 100) + "%"

                    mouseHitbox((canvas.width - 1180) / 2, escapemenuY + 690, 540, 100, "Leave")
                }
            }



            //draw the cursor
            canvas.style.cursor = !(MouseHover == null || MouseHover == "EscapeBackground") ? "var(--cursor2)" : "var(--cursor1)"

            if (window.gameconfig.ShowFPS && window.gameconfig.Debug) {
                drawText(
                    Math.round(1 / dt) + " FPS",
                    0,
                    1060,
                    40,
                    "Arial",
                    "#fff"
                )
            }

            if (window.cldelta.isOnline && (currentTime - lastNetworkTick >= NETWORK_TICK_RATE)) {
                // 1. Fetch the raw animation frame object matrix
                let rawAnimFrame = typeof getAnimationFrame === 'function' ? getAnimationFrame() : null;

                // 2. Double-check guard: If it's missing or an unready string, pass a default idle animation
                let safeFramePacket = rawAnimFrame;
                if (!safeFramePacket || typeof safeFramePacket !== 'object') {
                    safeFramePacket = animationFrames.Idle[0]
                };

                // 3. Broadcast all required values directly over CloudLink P2P channels
                window.cldelta.broadcast({
                    type: "LIVEDATA",
                    x: PlrX,                // Player X cordinate
                    y: PlrY,                // Player Y cordinate
                    g: Currentgame,         // Current playing game
                    sx: Scrollx,            // Camera scroll
                    s: Size,                // Scale of the avatar
                    m: facingleft,          // Avatar should be mirrored on render
                    n: window.gameconfig.Name,         // Preffered name
                    time: Date.now(),       // current time, used for ping calculation
                    state: safeFramePacket  // Animation data
                });

                lastNetworkTick = currentTime;
            }

            lasttime = currentTime
            requestAnimationFrame(gameLoop); //request next frame
        }

        requestAnimationFrame(gameLoop); //start the game loop
    </script>
</body>
