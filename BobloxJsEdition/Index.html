    <script>
        (function () {

            const screenConsole = document.getElementById('game-console'); //fetch the gui console 

            //define the original outputs for the cosole
            const originalLog = console.log;
            const originalWarn = console.warn;
            const originalError = console.error;


            function safePrintToScreen(messageArray, color = "#4CAF50") {
                try {
                    if (!screenConsole) return;

                    // Convert arguments to safe strings. 
                    // If someone passes a circular object or an invalid variable, this prevents a crash.
                    let parsedMessage = messageArray.map(arg => {
                        if (typeof arg === 'object' && arg !== null) {
                            try {
                                return JSON.stringify(arg); // Convert object to text safely
                            } catch (e) {
                                return "[Unprintable Complex Object]";
                            }
                        }
                        return String(arg); // Convert numbers/strings safely
                    }).join(' ');

                    // Remove formatting flags so they don't break the HTML layout
                    const cleanMessage = parsedMessage.replace(/%c/g, '');

                    // Safely update the HTML
                    screenConsole.innerHTML += `<div style="color: ${color}">> ${cleanMessage}</div>`;
                    screenConsole.scrollTop = screenConsole.scrollHeight; // Keep scrolled to bottom
                } catch (fatalConsoleError) {
                    // If the screen logger itself breaks, do absolutely nothing.
                    // This prevents a logger error from ever crashing your actual game loop.
                }
            }

            // 1. Intercept Standard Uncaught Errors (e.g., "variable is not defined")
            window.addEventListener("error", (event) => {
                // Format a clean, human-readable error log for the gui console
                const cleanErrorMsg = `[CRASH AVOIDED] Line ${event.lineno}: ${event.message}`;

                if (typeof console.error === 'function') {
                    console.error(cleanErrorMsg);
                }

                // Returning TRUE stops the browser from throwing a fatal crash
                return true;
            });

            // 2. Intercept Broken Asynchronous Promises (e.g., Network/PeerJS timeouts)
            window.onunhandledrejection = function (event) {
                const cleanRejectMsg = `[ASYNC CRASH AVOIDED]: ${event.reason}`;

                if (typeof console.error === 'function') {
                    console.error(cleanRejectMsg);
                }

                // Prevent the default browser console thread crash sequence
                event.preventDefault();
            };


            // Overwrite the console channels with protected wrappers
            console.log = function (...args) {
                originalLog.apply(console, args); // Still print to real hidden console
                safePrintToScreen(args, "#4CAF50");
            };

            console.warn = function (...args) {
                originalWarn.apply(console, args); // Still warn to real hidden console
                safePrintToScreen(args, "#FF9800");
            };

            console.error = function (...args) {
                originalError.apply(console, args); // Guess what this does
                safePrintToScreen(args, "#FF5252");
            };
        })();

    </script>

    <script>
        // this is extracted code from CloudLink Delta https://github.com/cloudlink-delta
        (function () {
            // 1. Establish the fallback layer instantly to protect the game loop
            class FallbackOfflineLink {
                constructor() {
                    this.isOnline = false;
                    console.log("[Engine Cloud] Initialized in Local Offline Mode.");
                }
                broadcast() { /* Drops outbound network ticks silently when offline */ }
                connectToPeer() { console.warn("Network unavailable. Cannot link players."); return null; }
            }

            // Assign baseline safety net variable immediately
            window.cldelta = new FallbackOfflineLink();

            // Integrated official v1.5.5 script link priority array
            const PEERJS_SOURCES = [
                'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js',
                'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js'
            ];

            // 2. Real networking controller executed only if a library path resolves completely
            class CloudLinkDeltaStandalone {
                constructor() {
                    this.peer = null;
                    this.name = '';
                    this.dataConnections = new Map();
                    this.newestConnected = '';
                    this.lastDisconnected = '';
                    this.peerStatus = 'idle';
                    this.verboseLogs = false;

                    // Extracted official cloud signaling architecture parameters
                    this.sessionServer = {
                        host: 'peerjs.mikedev101.cc',
                        port: 443,
                        secure: true,
                        path: '/',
                        key: 'peerjs',
                        config: {
                            iceTransportPolicy: 'all',
                            iceServers: [
                                // Safe, globally whitelisted STUN servers that school filters never block
                                { urls: 'stun:google.com' },
                                { urls: 'stun:google.com' },
                                { urls: 'stun:google.com' },
                                { urls: 'stun:cloudflare.com' }
                            ]
                        }
                    };


                    this.gmsg_state = new Map(); // Global Message state
                    this.pmsg_state = new Map(); // Private Message state
                }

                connect(username) {
                    if (!username || username.trim() === "") {
                        console.error("[CLΔ Standalone] Username cannot be empty.");
                        return;
                    }
                    this.peerStatus = 'connecting';
                    this.name = username.trim();

                    try {
                        this.peer = new Peer(this.name, {
                            host: this.sessionServer.host,
                            port: this.sessionServer.port,
                            secure: this.sessionServer.secure,
                            path: this.sessionServer.path,
                            key: this.sessionServer.key,
                            config: this.sessionServer.config,
                            debug: this.verboseLogs ? 3 : 1
                        });
                        this.attachSignalHandlers();
                    } catch (e) {
                        this.peerStatus = 'error';
                        console.error("[CLΔ Standalone] Instantiation step failed:", e);
                    }
                }

                attachSignalHandlers() {
                    this.peer.on('open', (id) => {
                        this.peerStatus = 'open';
                        this.isOnline = true;
                        console.log(`%c[CLΔ Engine] Connected to matchmaker! Player Session ID: ${id}`);
                        if (typeof window.onEngineNetworkOpen === 'function') window.onEngineNetworkOpen(id);
                    });

                    this.peer.on('connection', (conn) => {
                        this.dataConnections.set(conn.peer, conn);
                        this.bindConnectionChannels(conn);
                    });

                    this.peer.on('disconnected', () => {
                        this.peerStatus = 'disconnected';
                        this.isOnline = false;
                        console.warn("[CLΔ Engine] Disconnected from signaling nodes.");
                    });

                    this.peer.on('error', (err) => {
                        this.peerStatus = 'error';
                        this.isOnline = false;
                        console.error("[CLΔ Engine] Internal pipeline error:", err);
                    });
                }

                bindConnectionChannels(conn) {
                    conn.on('open', () => {
                        this.newestConnected = conn.peer;
                        console.log(`[CLΔ Engine] Target peer linked successfully: ${conn.peer}`);

                        // Perform official CLD Protocol initialization packet broadcast handshake
                        conn.send(JSON.stringify({
                            opcode: 'NEGOTIATE',
                            ttl: 1,
                            payload: { version: { major: 1, minor: 0, patch: 0 }, spec_version: 0 }
                        }));

                        if (typeof window.onPeerLinked === 'function') window.onPeerLinked(conn.peer);
                    });

                    conn.on('data', (raw) => {
                        try {
                            const packet = typeof raw === 'string' ? JSON.parse(raw) : raw;
                            this.routeIncomingProtocol(conn.peer, packet);
                        } catch (err) {
                            console.error("[CLΔ Engine] Error parsing network data packet:", err);
                        }
                    });

                    conn.on('close', () => {
                        this.lastDisconnected = conn.peer;
                        this.dataConnections.delete(conn.peer);
                        console.log(`[CLΔ Engine] Peer dropped connection: ${conn.peer}`);
                        if (typeof window.onPeerDropped === 'function') window.onPeerDropped(conn.peer);
                    });
                }

                routeIncomingProtocol(sender, packet) {
                    const { opcode, payload } = packet;

                    switch (opcode) {
                        case 'G_MSG': // Global Network Packet Broadcast updates
                            this.gmsg_state.set('default', payload);
                            if (typeof window.routeIncomingGameData === 'function') {
                                window.routeIncomingGameData({ type: 'BROADCAST', from: sender, data: payload });
                            }
                            break;

                        case 'P_MSG': // Private Peer targeted messaging frames
                            if (!this.pmsg_state.has(sender)) this.pmsg_state.set(sender, new Map());
                            this.pmsg_state.get(sender).set('default', payload);
                            if (typeof window.routeIncomingGameData === 'function') {
                                window.routeIncomingGameData({ type: 'PRIVATE', from: sender, data: payload });
                            }
                            break;

                        default:
                            break;
                    }
                }

                connectToPeer(targetId) {
                    if (!this.peer || this.peer.destroyed) return null;

                    // Simplifies connection execution loops to protect Chromebook sandboxes
                    const conn = this.peer.connect(targetId);

                    this.dataConnections.set(targetId, conn);
                    this.bindConnectionChannels(conn);
                    return conn;
                }


                broadcast(message) {
                    const packet = { opcode: 'G_MSG', origin: this.name, ttl: 1, target: '*', payload: message };
                    for (const [peerId, conn] of this.dataConnections) {
                        if (conn.open) conn.send(JSON.stringify(packet));
                    }
                }

                sendPrivate(targetId, message) {
                    const packet = { opcode: 'P_MSG', origin: this.name, ttl: 1, target: targetId, payload: message };
                    const conn = this.dataConnections.get(targetId);
                    if (conn && conn.open) conn.send(JSON.stringify(packet));
                }
            }

            // 3. Dynamic Sequential Loader Loop matching the original fallback array scheme
            async function loadPeerInfrastructure(index = 0) {
                if (index >= PEERJS_SOURCES.length) {
                    console.warn("[CLΔ Core Loader] All CDN routes exhausted. Staying in offline sandbox mode.");
                    return;
                }

                const scriptUrl = PEERJS_SOURCES[index];
                const scriptEl = document.createElement('script');

                // NEW CRITICAL LINE: This tells the browser to unmute the errors for this file!
                scriptEl.crossOrigin = "anonymous";
                scriptEl.src = scriptUrl;

                scriptEl.onload = function () {
                    window.cldelta = new CloudLinkDeltaStandalone();
                    console.log(`[CLΔ Core Loader] Infrastructure bound successfully via index ${index}`);
                };

                scriptEl.onerror = function () {
                    console.warn(`[CLΔ Core Loader] Route failed to resolve: ${scriptUrl}. Switching targets...`);
                    loadPeerInfrastructure(index + 1);
                };

                document.head.appendChild(scriptEl);
            }


            // Initiate the sequential load process automatically on boot up
            loadPeerInfrastructure(0);
        })();
    </script>


    <script>
        let chatBackground = document.getElementById("ChatBox")
        function DrawMessage(str) {
            chatBackground.innerHTML += `<div class="chatmessage">${str}</div>`
        }

        // A safe helper function to generate a cryptographic UUID string v4 natively
        function generateEngineUUID() {
            try {
                // Native modern browser method (fastest and most secure)
                return window.crypto.randomUUID();
            } catch (e) {
                // Safe math fallback string generator just in case crypto flags fail on older devices
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }
        }

        // Generate and store a unique identifier for the session
        const MY_UNIQUE_PLAYER_ID = "BOBLOX_" + generateEngineUUID().substring(0, 8); // Uses first 8 characters for readable logs

        function startMultiplayerNetwork() {
            if (typeof window.cldelta.connect === 'function') {
                console.log(`[Engine Cloud] Infrastructure ready. Registering session as: ${MY_UNIQUE_PLAYER_ID}`);

                // Pass the new UUID token into the matchmaker node
                window.cldelta.connect(MY_UNIQUE_PLAYER_ID);
            } else {
                setTimeout(startMultiplayerNetwork, 100);
            }
        }

        // Run the initialization sequence loop
        startMultiplayerNetwork();


        window.onEngineNetworkOpen = function (myFinalId) {
            console.log("Success! I am live on the network pool as: " + myFinalId);
        };

        window.onPeerLinked = function (remotePlayerId) {
            console.log("[NETWORK] Connected to player: " + remotePlayerId);
        };

        window.onPeerDropped = function (remotePlayerId) {
            console.log("[NETWORK] Player left the game: " + remotePlayerId);

            if (remotePlayers && remotePlayers[remotePlayerId]) {
                delete remotePlayers[remotePlayerId]; //removes players when disconnecting
            }
        };

        // A persistent state storage map to track all active network character objects
        let remotePlayers = {};

        // Override the network gateway listener to process the required payload variables
        window.routeIncomingGameData = function (payload) {
            const remoteSender = payload.from;
            const packet = payload.data;

            // Check the data type 
            if (packet.type === "LIVEDATA") { //player updates

                // If the player hasn't been added yet
                if (!remotePlayers[remoteSender]) {
                    remotePlayers[remoteSender] = { x: 0, y: 0, sx: 0, state: 0, lastUpdate: Date.now() };
                    console.log(`%c[BOBLOX Engine] Initialized character view loop instance for: ${remoteSender}`);
                }

                // Store all critical variables directly into a table
                remotePlayers[remoteSender].x = packet.x;                 // Character X Coordinate
                remotePlayers[remoteSender].y = packet.y;                 // Character Y Coordinate
                remotePlayers[remoteSender].sx = packet.sx;               // Their X scroll
                remotePlayers[remoteSender].state = packet.state;         // Their current animation data (sending it fully allow custom modded animations that work with base clients)
                remotePlayers[remoteSender].g = packet.g;                 // The game they're currently in
                remotePlayers[remoteSender].s = packet.s;                 // Avatar scale in decimal
                remotePlayers[remoteSender].m = packet.m;                 // Should we mirror the player model when rendering 
                remotePlayers[remoteSender].n = packet.n;                 // Preffered name for stuff like the chat
                remotePlayers[remoteSender].lastUpdate = Date.now();      // Heartbeat time for auto unloading

            } else if (packet.type === "CHAT" && package.g == Currentgame) { //check if its a chat packet
                DrawMessage(String(JSON.parse(packet.n)) + ": " + String(packet.text)) //print the chat message if its a chat packet
            }

        };

        /*  
        ####################################
        #SUPABASE API FOR AVAILABLE SERVERS#
        ####################################
        */

        // supabase API URL
        const SUPABASE_URL = "https://wzcrhodevcelyjxsmdcp.supabase.co";
        // supabase key, this is not unsafe because its a public anon key
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6Y3Job2RldmNlbHlqeHNtZGNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzQ5MjIsImV4cCI6MjEwMzMxMDkyMn0.7wGVjetb2PRM-JcU7lUwn0S3hPT3UlBqc4o2gQweV3k";

        const DB_HEADERS = {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json"
        };

        let heartbeatIntervalTimer = null;
        // 1. ROUTINE: Notify the supabase servers that the client is hosting a server
        async function registerServerInCloud(roomCode, serverName) {
            try {
                const payload = {
                    room_code: roomCode,
                    server_name: serverName,
                    player_count: 1
                };

                // check if the room already exists in the database
                const checkResponse = await fetch(`${SUPABASE_URL}/rest/v1/active_servers?room_code=eq.${roomCode}`, {
                    method: "GET",
                    headers: DB_HEADERS
                });
                const existingRooms = await checkResponse.json();

                let response;
                if (existingRooms.length > 0) {
                    // If it exists, update it (this triggers a fresh heartbeat timestamp)
                    response = await fetch(`${SUPABASE_URL}/rest/v1/active_servers?room_code=eq.${roomCode}`, {
                        method: "PATCH",
                        headers: DB_HEADERS,
                        body: JSON.stringify({ server_name: serverName, player_count: 1 })
                    });
                } else {
                    // If it doesn't exist, create it
                    response = await fetch(`${SUPABASE_URL}/rest/v1/active_servers`, {
                        method: "POST",
                        headers: DB_HEADERS,
                        body: JSON.stringify(payload)
                    });
                }

                if (response.ok) {
                    console.log("Server published to cloud registry.");

                    // start the heartbeat loop to prevent the server from being removed
                    if (!heartbeatIntervalTimer) {
                        heartbeatIntervalTimer = setInterval(function () {
                            if (window.cldelta.isOnline && isLobbyHost) {
                                console.log("Sending heartbeat ping to cloud database...");
                                // Re-running this function sends a PATCH request, updating the timestamp row
                                registerServerInCloud(roomCode, serverName);
                            } else {
                                // If we are no longer hosting, destroy the loop timer
                                clearInterval(heartbeatIntervalTimer);
                                heartbeatIntervalTimer = null;
                            }
                        }, 30000); // 30000 milliseconds = 30 seconds
                    }
                }
            } catch (e) {
                console.log("Database communication failed: " + e.message);
            }
        }


        // 2. ROUTINE: Grab the active directory table to draw the server browser list
        async function fetchActiveCloudServers() {
            try {
                // Fetch rows updated in the last 60 seconds to eliminate dead game ghosts
                const cutoffTime = new Date(Date.now() - 60000).toISOString();
                const url = `${SUPABASE_URL}/rest/v1/active_servers?last_heartbeat=gt.${cutoffTime}&select=*`;

                const response = await fetch(url, { method: "GET", headers: DB_HEADERS });
                const servers = await response.json();

                console.log(`Fetched ${servers.length} live matching lobbies from database.`);
                return servers; // Returns an array of live room objects
            } catch (e) {
                console.log("Database download failed: " + e.message);
                return [];
            }
        }

        // 3. ROUTINE: Remove your server from the cloud when you close the room

        function drawRoundedRectangle(X, Y, Width, Height, Radius, Color) {
            ctx.fillStyle = Color;
            ctx.beginPath();
            ctx.roundRect(X, Y, Width, Height, Radius);
            ctx.fill();
        }

        function drawRotatedRectangle(X, Y, Width, Height, Degrees, Color) {
            ctx.fillStyle = Color;
            ctx.save();

            // Move grid origin to the center of where the rectangle should be
            ctx.translate(X + Width / 2, Y + Height / 2);

            // Rotate the grid
            ctx.rotate((Degrees * Math.PI) / 180);

            // Draw the rectangle centered on the new origin
            ctx.fillRect(-Width / 2, -Height / 2, Width, Height);

            ctx.restore();
        }

        function drawRotatedRoundedRectangle(X, Y, Width, Height, Radius, Degrees, Color) {
            ctx.fillStyle = Color;
            ctx.save();

            ctx.translate(X + Width / 2, Y + Height / 2);
            ctx.rotate((Degrees * Math.PI) / 180);

            ctx.beginPath();
            ctx.roundRect(-Width / 2, -Height / 2, Width, Height, Radius);
            ctx.fill();

            ctx.restore();
        }

        function drawRotatedImage(image, X, Y, Scale, Degrees) {
            // 1. Skip if the image hasn't fully loaded from the disk yet
            if (image.naturalWidth === 0) return;

            // 2. Calculate the scaled dimensions
            const width = image.naturalWidth * Scale;
            const height = image.naturalHeight * Scale;

            ctx.save();

            // 3. Move the grid origin to the center of the image location
            ctx.translate(X + width / 2, Y + height / 2);

            // 4. Rotate the grid (Degrees to Radians)
            ctx.rotate((Degrees * Math.PI) / 180);

            // 5. Draw the image centered on the new origin using negative half-sizes
            ctx.drawImage(image, -width / 2, -height / 2, width, height);

            ctx.restore();
        }

        function drawSpriteSheet(img, cx, cy, sx, sy, w, h) {

            } catch (error) {

            }
        }

        function drawComplexImage(image, X, Y, Scale, Degrees, MirrorX) {
            if (image.naturalWidth === 0) return;

            const width = image.naturalWidth * Scale;
            const height = image.naturalHeight * Scale;

            ctx.save();
            ctx.translate(X + width / 2, Y + height / 2);

            // 1. Handle mirroring first
            const flipX = MirrorX ? -1 : 1;
            ctx.scale(flipX, 1);

            // 2. Handle rotation second (Invert degrees if mirrored so it rotates the correct direction)
            ctx.rotate(((Degrees * flipX) * Math.PI) / 180);

            ctx.drawImage(image, -width / 2, -height / 2, width, height);

            ctx.restore();
        }

        function DarkenHex(hex) {
            let cleanHex = hex.replace('#', '');
            let isShort = cleanHex.length === 3;

            if (isShort) {
                // Subtract 2 from each shorthand hex digit (approx. 32 in 8-bit)
                return '#' + Array.from(cleanHex).map(char => {
                    let val = parseInt(char, 16);
                    return Math.max(0, val - 2).toString(16);
                }).join('');
            } else {
                // Process standard 6-digit hex
                let r = parseInt(cleanHex.substring(0, 2), 16);
                let g = parseInt(cleanHex.substring(2, 4), 16);
                let b = parseInt(cleanHex.substring(4, 6), 16);

                r = Math.max(0, r - 32).toString(16).padStart(2, '0');
                g = Math.max(0, g - 32).toString(16).padStart(2, '0');
                b = Math.max(0, b - 32).toString(16).padStart(2, '0');

                return `#${r}${g}${b}`;
            }
        }

            // Intercept automatic lobby routing updates sent by the host
            if (packet.type === "ROOM_SYNC" && !isLobbyHost) {
                console.log("Received room cluster updates from Lobby Host.");

                // Loop through all existing players in the match and bind to them
                packet.peers.forEach(peerId => {
                    if (peerId !== window.cldelta.name && !connectedPeersList.includes(peerId)) {
                        console.log("Auto-linking to peer member: " + peerId);
                        window.cldelta.connectToPeer(peerId);
                        connectedPeersList.push(peerId);
                    }
                });
            }
        };

        let chatopen = false

        //save configs
        window.addEventListener("beforeunload", (event) => {
            saveConfigValue("Name", JSON.stringify(config.Name))
        });

        /*
        ###########
        #GAME LOOP#
        ###########
        */

        let chatmenudisplay = "none"

        let escapemenudisplay = "block"
        let escapemenu = document.getElementById("escapemenu")

        function gameLoop(currentTime) {
            let dt = (currentTime - lastTime) / 1000;
            if (Number.isNaN(dt) || dt > 0.1) dt = 0;
            lastTime = currentTime;
            //set reset hovering id
            MouseHover = null
            let leftrightbias = 0

            animationClock = Math.max(animationClock - dt * ((characterState == "Walking") ? (speed / 50) : 1), 0)

            escapemenuY += dt * 4000 * (EscapeMenuOpen ? -1 : 1)
            escapemenuY = clamp(escapemenuY, 120, 1080)

            //clear the canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawRectangle(0, 0, canvas.width, canvas.height, "#111")

            //handle Key inputs
            if (Currentgame == 0) {
                PlrX = 123
                PlrY = 480
                Size = 3
                facingleft = false
                characterState = "Idle"
                animframe = 0
            } else {
                PlrY += yvel * dt
                let canvasfocus = isFocused(canvas)
                if (canvasfocus) {
                    if (keysdown.has("ArrowLeft")) { leftrightbias -= 1 }
                    if (keysdown.has("a")) { leftrightbias -= 1 }
                    if (keysdown.has("ArrowRight")) { leftrightbias += 1 }
                    if (keysdown.has("d")) { leftrightbias += 1 }
                }

                if (leftrightbias > 0) { facingleft = false }
                if (leftrightbias < 0) { facingleft = true }
                if (Currentgame != prevgame) {
                    chatBackground.innerHTML = ""
                    GameDataLoaded = gamedata[String(Currentgame)]
                    PlrX = GameDataLoaded.startposx
                    PlrY = GameDataLoaded.startposy
                    yvel = 0
                    Scrollx = 0
                    Size = GameDataLoaded.Size
                }
                ctx.drawImage(GameDataLoaded.Skybox, 0, 0)
                let movex = clamp(leftrightbias, -1, 1) * dt * speed * Size
                if (PlrY >= GameDataLoaded.floor) {
                    if (movex == 0) {
                        characterState = "Idle"
                        animframe = 0
                    } else {
                        if (characterState != "Walking") {
                            animframe = 0
                            animationClock = WalkFrameOrder.length / walkanimspeed
                        }
                        characterState = "Walking"
                        if (animationClock == 0) {
                            animationClock = WalkFrameOrder.length / walkanimspeed
                        }
                        animframe = WalkFrameOrder[WalkFrameOrder.length - 1 - clamp(Math.floor(animationClock * walkanimspeed), 0, WalkFrameOrder.length - 1)]
                    }
                }
                if (GameDataLoaded.width - 1920 - Scrollx <= 0 && leftrightbias > 0) {
                    PlrX += movex
                }
                if (Scrollx <= 0 && leftrightbias < 0) {
                    PlrX += movex
                }
                if (PlrX < 10 * Size) {
                    PlrX = 10 * Size
                    if (PlrY >= GameDataLoaded.floor || characterState == "Walking") {
                        characterState = "Idle",
                            animframe = 0
                    }
                }
                if (PlrX > 1920 - 10 * Size) {
                    PlrX = 1920 - 10 * Size
                    if (PlrY >= GameDataLoaded.floor || characterState == "Walking") {
                        characterState = "Idle",
                            animframe = 0
                    }
                }
                if (PlrY >= GameDataLoaded.floor) {
                    yvel = 0
                    PlrY = GameDataLoaded.floor
                    if (canvasfocus && (keysdown.has("w") || keysdown.has("ArrowUp"))) {
                        yvel = -Size * (jumppower / 2)
                        animationClock = 0.1
                        characterState = "Airborne"
                        animframe = 0
                    }
                } else {
                    characterState = "Airborne"
                    if (animationClock > 0) {
                        animframe = 0
                    } else {
                        animframe = 1
                    }
                    yvel += 1000 * Size * dt
                }


            }
            prevgame = Currentgame

            for (let id in remotePlayers) {
                let p = remotePlayers[id];

                if (Date.now() - p.lastUpdate > 25000) {
                    delete remotePlayers[id];
                    continue;
                }

                if (p.g == Currentgame) {
                    let renderX = p.x + p.sx - Scrollx; // Subtracting the local camera scroll value positions
                    let renderY = p.y;
                    drawCharacter(renderX, renderY, p.s, p.state, p.m)
                }
            }


            //Draw the character
            drawCharacter(PlrX, PlrY, Size, getAnimationFrame(), facingleft)


            if (Currentgame == 0) {
                EscapeMenuOpen = false
                escapemenuY = 1080
                //draw the overlaid boblox javascript edition logo
                drawSpriteSheet(UISheet, 10, 10, 60, 0, 315, 90)
                mouseHitbox(10, 10, 315, 90, "Logo") //clickbox redirects to github repo

                drawSpriteSheet(UISheet, 335, 40, 380, 30, 60, 60)
                mouseHitbox(335, 40, 60, 60, "HomeTab")

                drawSpriteSheet(UISheet, 395, 40, 380, 90, 60, 60)
                mouseHitbox(395, 40, 60, 60, "SettingsTab")

                if (menu == 0) {
                    //draw games on home menu
                    drawSpriteSheet(UISheet, 235, 120, 0, 90, 240, 240)
                    //ctx.drawImage(tycoonico, 235, 120, 240, 240)
                    mouseHitbox(235, 120, 240, 240, "Tycoonicon")
                } else if (menu == 1) {
                    // toggle background blur
                    drawSpriteSheet(UISheet, 235, 120, 0, config.BackgroundBlur ? 60 : 30, 60, 30)
                    mouseHitbox(235, 120, 60, 30, "ToggleBlur")
                    drawText("Enable Ui blur", 295, 135, 30, "Arial", "#fff")

                    // toggle debug settings
                    drawSpriteSheet(UISheet, 235, 160, 0, config.Debug ? 60 : 30, 60, 30)
                    mouseHitbox(235, 160, 60, 30, "ToggleDebug")
                    drawText("Debug options", 295, 175, 30, "Arial", "#fff")

                    if (config.Debug) { // check if debug options are enabled
                        //draw fps toggle
                        drawSpriteSheet(UISheet, 265, 200, 0, config.ShowFPS ? 60 : 30, 60, 30)
                        mouseHitbox(265, 200, 60, 30, "ToggleFPS")
                        drawText("Show FPS", 325, 215, 30, "Arial", "#fff")
                    }

                    const offset = config.debug ? 40 : 0

                }

                if (chatmenudisplay !== "none") { // check and update if its not set to none
                    chatContainer.style.display = chatmenudisplay = "none"
                }
                if (escapemenudisplay !== "none") { // check and update if its not set to none
                    escapemenu.style.display = escapemenudisplay = "none"
                }
            } else {

                if (GameDataLoaded) {
                    ctx.drawImage(GameDataLoaded.foreground, 0, 0)
                }

                if ((chatopen && !EscapeMenuOpen ? "block" : "none" /* gets the target display type */) !== chatmenudisplay) {
                    chatContainer.style.display = chatmenudisplay = chatmenudisplay === "none" ? "block" : "none"; // update if outdated
                }

                //draw the Boblox escape menu button
                circularMouseHitbox(35, 35, 25, "OpenEscape")
                drawRoundedRectangle(10, 10, 50, 50, 25, (MouseHover == "OpenEscape" && !EscapeMenuOpen) ? "#9999" : "#0009")
                drawSpriteSheet(UISheet, 20, 20, 30, 0, 30, 30)


                //draw the chat button
                circularMouseHitbox(95, 35, 25, "OpenChat")
                drawRoundedRectangle(70, 10, 50, 50, 25, (MouseHover == "OpenChat" && !EscapeMenuOpen) ? "#9999" : "#0009")
                drawSpriteSheet(UISheet, 80, 20, chatopen ? 410 : 380, 0, 30, 30)

                //draw the escape menu
                if ((escapemenuY < 1080 ? "block" : "none" /* gets the target display type */) !== escapemenudisplay) {
                    escapemenu.style.display = escapemenudisplay = escapemenudisplay === "none" ? "block" : "none"; // update if outdated
                }
                if (escapemenuY < 1080) {
                    if (EscapeMenuOpen) {
                        MouseHover = null
                        mouseHitbox((canvas.width - 1280) / 2, escapemenuY, 1280, 840, "EscapeBackground")
                    }
                    escapemenu.style.top = (escapemenuY / canvas.height * 100) + "%"

                    mouseHitbox((canvas.width - 1180) / 2, escapemenuY + 690, 540, 100, "Leave")
                }
            }



            //draw the cursor
            canvas.style.cursor = !(MouseHover == null || MouseHover == "EscapeBackground") ? "var(--cursor2)" : "var(--cursor1)"

            if (config.ShowFPS && config.Debug) {
                drawText(
                    Math.round(1 / dt) + " FPS",
                    0,
                    1060,
                    40,
                    "Arial",
                    "#fff"
                )
            }

            if (window.cldelta.isOnline && (currentTime - lastNetworkTick >= NETWORK_TICK_RATE)) {
                // 1. Fetch the raw animation frame object matrix
                let rawAnimFrame = typeof getAnimationFrame === 'function' ? getAnimationFrame() : null;

                // 2. Double-check guard: If it's missing or an unready string, pass a default idle animation
                let safeFramePacket = rawAnimFrame;
                if (!safeFramePacket || typeof safeFramePacket !== 'object') {
                    safeFramePacket = animationFrames.Idle[0]
                };

                // 3. Broadcast all required values directly over CloudLink P2P channels
                window.cldelta.broadcast({
                    type: "LIVEDATA",
                    x: PlrX,                // Player X cordinate
                    y: PlrY,                // Player Y cordinate
                    g: Currentgame,         // Current playing game
                    sx: Scrollx,            // Camera scroll
                    s: Size,                // Scale of the avatar
                    m: facingleft,          // Avatar should be mirrored on render
                    n: config.Name,         // Preffered name
                    state: safeFramePacket  // Animation data
                });



                lastNetworkTick = currentTime;
            }


            lasttime = currentTime
            requestAnimationFrame(gameLoop); //request next frame
        }

        requestAnimationFrame(gameLoop); //start the game loop
    </script>
</body>
