    <script>
        (function () {

            const screenConsole = document.getElementById('game-console');
            const originalLog = console.log;
            const originalWarn = console.warn;
            const originalError = console.error;

            function safePrintToScreen(messageArray, color = "#4CAF50") {
                // This acts as a Lua "pcall" - protecting your entire game thread
                try {
                    if (!screenConsole) return;

                    // Convert arguments to safe strings. 
                    // If someone passes a circular object or an invalid variable, this prevents a crash.
                    let parsedMessage = messageArray.map(arg => {
                        if (typeof arg === 'object' && arg !== null) {
                            try {
                                return JSON.stringify(arg); // Convert object to text safely
                            } catch (e) {
                                return "[Unprintable Complex Object]";
                            }
                        }
                        return String(arg); // Convert numbers/strings safely
                    }).join(' ');

                    // Remove formatting flags so they don't break the HTML layout
                    const cleanMessage = parsedMessage.replace(/%c/g, '');

                    // Safely update the HTML
                    screenConsole.innerHTML += `<div style="color: ${color}">> ${cleanMessage}</div>`;
                    screenConsole.scrollTop = screenConsole.scrollHeight; // Keep scrolled to bottom
                } catch (fatalConsoleError) {
                    // If the screen logger itself breaks, do absolutely nothing.
                    // This prevents a logger error from ever crashing your actual game loop.
                }
            }

            // 1. Intercept Standard Uncaught Errors (e.g., "variable is not defined")
            window.onerror = function (message, source, lineno, colno, error) {
                // Format a clean, human-readable error log for your screen overlay
                const cleanErrorMsg = `[CRASH AVOIDED] Line ${lineno}: ${message}`;

                if (typeof console.error === 'function') {
                    console.error(cleanErrorMsg);
                }

                // Returning TRUE stops the browser from throwing a fatal, script-killing crash!
                return true;
            };

            // 2. Intercept Broken Asynchronous Promises (e.g., Network/PeerJS timeouts)
            window.onunhandledrejection = function (event) {
                const cleanRejectMsg = `[ASYNC CRASH AVOIDED]: ${event.reason}`;

                if (typeof console.error === 'function') {
                    console.error(cleanRejectMsg);
                }

                // Prevent the default browser console thread crash sequence
                event.preventDefault();
            };


            // Overwrite the console channels with protected wrappers
            console.log = function (...args) {
                originalLog.apply(console, args); // Still print to real hidden console
                safePrintToScreen(args, "#4CAF50");
            };

            console.warn = function (...args) {
                originalWarn.apply(console, args);
                safePrintToScreen(args, "#FF9800");
            };

            console.error = function (...args) {
                originalError.apply(console, args);
                safePrintToScreen(args, "#FF5252");
            };
        })();

    </script>

    <script>
        (function () {
            // 1. Establish the fallback layer instantly to protect your 60fps frame loop
            class FallbackOfflineLink {
                constructor() {
                    this.isOnline = false;
                    console.log("%c[Engine Cloud] Initialized in Local Offline Mode.");
                }
                broadcast() { /* Drops outbound network ticks silently when offline */ }
                connectToPeer() { console.warn("Network unavailable. Cannot link players."); return null; }
            }

            // Assign baseline safety net variable immediately
            window.cldelta = new FallbackOfflineLink();

            // Integrated official v1.5.5 script link priority array
            const PEERJS_SOURCES = [
                'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js',
                'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js'
            ];

            // 2. Real networking controller executed only if a library path resolves completely
            class CloudLinkDeltaStandalone {
                constructor() {
                    this.peer = null;
                    this.name = '';
                    this.dataConnections = new Map();
                    this.newestConnected = '';
                    this.lastDisconnected = '';
                    this.peerStatus = 'idle';
                    this.verboseLogs = false;

                    // Extracted official cloud signaling architecture parameters
                    this.sessionServer = {
                        host: 'peerjs.mikedev101.cc',
                        port: 443,
                        secure: true,
                        path: '/',
                        key: 'peerjs',
                        config: {
                            iceTransportPolicy: 'all',
                            iceServers: [
                                { urls: ['stun:vpn.mikedev101.cc:3478', 'stun:vpn.mikedev101.cc:5349'] },
                                { urls: ['turn:vpn.mikedev101.cc:3478', 'turn:vpn.mikedev101.cc:5349'], username: 'free', credential: 'free' },
                                {
                                    urls: [
                                        'stun:://google.com', 'stun:://google.com',
                                        'stun:://google.com', 'stun:://google.com',
                                        'stun:://cloudflare.com', 'stun:://cloudflare.com'
                                    ]
                                }
                            ]
                        }
                    };

                    this.gmsg_state = new Map();
                    this.pmsg_state = new Map();
                }

                connect(username) {
                    if (!username || username.trim() === "") {
                        console.error("[CLΔ Standalone] Username cannot be empty.");
                        return;
                    }
                    this.peerStatus = 'connecting';
                    this.name = username.trim();

                    try {
                        this.peer = new Peer(this.name, {
                            host: this.sessionServer.host,
                            port: this.sessionServer.port,
                            secure: this.sessionServer.secure,
                            path: this.sessionServer.path,
                            key: this.sessionServer.key,
                            config: this.sessionServer.config,
                            debug: this.verboseLogs ? 3 : 1
                        });
                        this.attachSignalHandlers();
                    } catch (e) {
                        this.peerStatus = 'error';
                        console.error("[CLΔ Standalone] Instantiation step failed:", e);
                    }
                }

                attachSignalHandlers() {
                    this.peer.on('open', (id) => {
                        this.peerStatus = 'open';
                        this.isOnline = true;
                        console.log(`%c[CLΔ Engine] Connected to matchmaker! Player Session ID: ${id}`);
                        if (typeof window.onEngineNetworkOpen === 'function') window.onEngineNetworkOpen(id);
                    });

                    this.peer.on('connection', (conn) => {
                        this.dataConnections.set(conn.peer, conn);
                        this.bindConnectionChannels(conn);
                    });

                    this.peer.on('disconnected', () => {
                        this.peerStatus = 'disconnected';
                        this.isOnline = false;
                        console.warn("[CLΔ Engine] Disconnected from signaling nodes.");
                    });

                    this.peer.on('error', (err) => {
                        this.peerStatus = 'error';
                        this.isOnline = false;
                        console.error("[CLΔ Engine] Internal pipeline error:", err);
                    });
                }

                bindConnectionChannels(conn) {
                    conn.on('open', () => {
                        this.newestConnected = conn.peer;
                        console.log(`[CLΔ Engine] Target peer linked successfully: ${conn.peer}`);

                        // Perform official CLD Protocol initialization packet broadcast handshake
                        conn.send(JSON.stringify({
                            opcode: 'NEGOTIATE',
                            ttl: 1,
                            payload: { version: { major: 1, minor: 0, patch: 0 }, spec_version: 0 }
                        }));

                        if (typeof window.onPeerLinked === 'function') window.onPeerLinked(conn.peer);
                    });

                    conn.on('data', (raw) => {
                        try {
                            const packet = typeof raw === 'string' ? JSON.parse(raw) : raw;
                            this.routeIncomingProtocol(conn.peer, packet);
                        } catch (err) {
                            console.error("[CLΔ Engine] Error parsing network data packet:", err);
                        }
                    });

                    conn.on('close', () => {
                        this.lastDisconnected = conn.peer;
                        this.dataConnections.delete(conn.peer);
                        console.log(`[CLΔ Engine] Peer dropped connection: ${conn.peer}`);
                        if (typeof window.onPeerDropped === 'function') window.onPeerDropped(conn.peer);
                    });
                }

                routeIncomingProtocol(sender, packet) {
                    const { opcode, payload } = packet;

                    switch (opcode) {
                        case 'G_MSG': // Global Network Packet Broadcast updates
                            this.gmsg_state.set('default', payload);
                            if (typeof window.routeIncomingGameData === 'function') {
                                window.routeIncomingGameData({ type: 'BROADCAST', from: sender, data: payload });
                            }
                            break;

                        case 'P_MSG': // Private Peer targeted messaging frames
                            if (!this.pmsg_state.has(sender)) this.pmsg_state.set(sender, new Map());
                            this.pmsg_state.get(sender).set('default', payload);
                            if (typeof window.routeIncomingGameData === 'function') {
                                window.routeIncomingGameData({ type: 'PRIVATE', from: sender, data: payload });
                            }
                            break;

                        default:
                            break;
                    }
                }

                connectToPeer(targetId) {
                    if (!this.peer || this.peer.destroyed) return null;
                    const conn = this.peer.connect(targetId, {
                        metadata: { name: this.name, protocol: 'delta' },
                        reliable: true,
                        serialization: 'json'
                    });
                    this.dataConnections.set(targetId, conn);
                    this.bindConnectionChannels(conn);
                    return conn;
                }

                broadcast(message) {
                    const packet = { opcode: 'G_MSG', origin: this.name, ttl: 1, target: '*', payload: message };
                    for (const [peerId, conn] of this.dataConnections) {
                        if (conn.open) conn.send(JSON.stringify(packet));
                    }
                }

                sendPrivate(targetId, message) {
                    const packet = { opcode: 'P_MSG', origin: this.name, ttl: 1, target: targetId, payload: message };
                    const conn = this.dataConnections.get(targetId);
                    if (conn && conn.open) conn.send(JSON.stringify(packet));
                }
            }

            // 3. Dynamic Sequential Loader Loop matching the original fallback array scheme
            async function loadPeerInfrastructure(index = 0) {
                if (index >= PEERJS_SOURCES.length) {
                    console.warn("[CLΔ Core Loader] All CDN routes exhausted. Staying in offline sandbox mode.");
                    return;
                }

                const scriptUrl = PEERJS_SOURCES[index];
                const scriptEl = document.createElement('script');
                scriptEl.src = scriptUrl;

                scriptEl.onload = function () {
                    // Upgrade mock layer to an active online state class instantiation!
                    window.cldelta = new CloudLinkDeltaStandalone();
                    console.log(`%c[CLΔ Core Loader] Infrastructure bound successfully via path index ${index}`);
                };

                scriptEl.onerror = function () {
                    console.warn(`[CLΔ Core Loader] Route failed to resolve: ${scriptUrl}. Switching targets...`);
                    loadPeerInfrastructure(index + 1); // Try the next link in line
                };

                document.head.appendChild(scriptEl);
            }

            // Initiate the sequential load process automatically on boot up
            loadPeerInfrastructure(0);
        })();
    </script>

        // A safe helper function to generate a cryptographic UUID string v4 natively
        function generateEngineUUID() {
            try {
                // Native modern browser method (fastest and most secure)
                return window.crypto.randomUUID();
            } catch (e) {
                // Safe math fallback string generator just in case crypto flags fail on older devices
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }
        }

            const remoteSender = payload.from;

            // Filter incoming traffic so you only track characters inside your active sub-server room instance
            if (packet.type === "LIVEDATA" && packet.g === Currentgame) {

                if (!remotePlayers[remoteSender]) {

                remotePlayers[remoteSender].state = packet.state;         // Target active keyframe rendering frame pointer

            // Assign the calculated pixel integers to your existing variables

        function drawCursor(isHovering, draw) {
            if (!draw) { return } //skip drawing if draw is false
            const currentImg = isHovering ? cursorHov : cursor; //sets the active cursor texture based on hover status

            // Only draw if the browser has finished reading the image file dimensions
            if (currentImg.naturalWidth > 0) {

        function drawRectangle(X, Y, Width, Height, Color) {
            ctx.fillStyle = Color
            ctx.fillRect(X, Y, Width, Height)
        }

        function drawRoundedRectangle(X, Y, Width, Height, Radius, Color) {
            ctx.fillStyle = Color;
            ctx.beginPath();
            ctx.roundRect(X, Y, Width, Height, Radius);
            ctx.fill();
        }

        function drawRotatedRectangle(X, Y, Width, Height, Degrees, Color) {
            ctx.fillStyle = Color;
            ctx.save();

            // Move grid origin to the center of where the rectangle should be
            ctx.translate(X + Width / 2, Y + Height / 2);

            // Rotate the grid
            ctx.rotate((Degrees * Math.PI) / 180);

            // Draw the rectangle centered on the new origin
            ctx.fillRect(-Width / 2, -Height / 2, Width, Height);

            ctx.restore();
        }

        function drawRotatedRoundedRectangle(X, Y, Width, Height, Radius, Degrees, Color) {
            ctx.fillStyle = Color;
            ctx.save();

            ctx.translate(X + Width / 2, Y + Height / 2);
            ctx.rotate((Degrees * Math.PI) / 180);

            ctx.beginPath();
            ctx.roundRect(-Width / 2, -Height / 2, Width, Height, Radius);
            ctx.fill();

            ctx.restore();
        }

        function drawRotatedImage(image, X, Y, Scale, Degrees) {
            // 1. Skip if the image hasn't fully loaded from the disk yet
            if (image.naturalWidth === 0) return;

            // 2. Calculate the scaled dimensions
            const width = image.naturalWidth * Scale;
            const height = image.naturalHeight * Scale;

            ctx.save();

            // 3. Move the grid origin to the center of the image location
            ctx.translate(X + width / 2, Y + height / 2);

            // 4. Rotate the grid (Degrees to Radians)
            ctx.rotate((Degrees * Math.PI) / 180);

            // 5. Draw the image centered on the new origin using negative half-sizes
            ctx.drawImage(image, -width / 2, -height / 2, width, height);

            ctx.restore();
        }

        function drawComplexImage(image, X, Y, Scale, Degrees, MirrorX) {
            if (image.naturalWidth === 0) return;

            const width = image.naturalWidth * Scale;
            const height = image.naturalHeight * Scale;

            ctx.save();
            ctx.translate(X + width / 2, Y + height / 2);

            // 1. Handle mirroring first
            const flipX = MirrorX ? -1 : 1;
            ctx.scale(flipX, 1);

            // 2. Handle rotation second (Invert degrees if mirrored so it rotates the correct direction)
            ctx.rotate(((Degrees * flipX) * Math.PI) / 180);

            ctx.drawImage(image, -width / 2, -height / 2, width, height);

            ctx.restore();
        }

        function DarkenHex(hex) {
            let cleanHex = hex.replace('#', '');
            let isShort = cleanHex.length === 3;

            if (isShort) {
                // Subtract 2 from each shorthand hex digit (approx. 32 in 8-bit)
                return '#' + Array.from(cleanHex).map(char => {
                    let val = parseInt(char, 16);
                    return Math.max(0, val - 2).toString(16);
                }).join('');
            } else {
                // Process standard 6-digit hex
                let r = parseInt(cleanHex.substring(0, 2), 16);
                let g = parseInt(cleanHex.substring(2, 4), 16);
                let b = parseInt(cleanHex.substring(4, 6), 16);

                r = Math.max(0, r - 32).toString(16).padStart(2, '0');
                g = Math.max(0, g - 32).toString(16).padStart(2, '0');
                b = Math.max(0, b - 32).toString(16).padStart(2, '0');

                return `#${r}${g}${b}`;
            }

                    Head: { rot: 0, x: 0, y: -20 },
                    LArm: { rot: -40, x: 10, y: -4 },
                    RArm: { rot: 40, x: -10, y: -4 },
                    Torso: { rot: 0, x: 0, y: 0 },
                    LLeg: { rot: 40, x: -13, y: 35 },
                    RLeg: { rot: -40, x: 13, y: 35 },
                    Face: "PrefferedSide"
                },
                {
                    Head: { rot: 0, x: 0, y: -20 },
                    LArm: { rot: 15, x: -4, y: 0 },
                    RArm: { rot: -15, x: 4, y: 0 },
                    Torso: { rot: 0, x: 0, y: 0 },
                    LLeg: { rot: -15, x: 5, y: 39 },
                    RLeg: { rot: 15, x: -5, y: 39 },
                    Face: "PrefferedSide"
                },
                {
                    Head: { rot: 0, x: 0, y: -20 },
                    LArm: { rot: 30, x: -8, y: -2 },
                    RArm: { rot: -30, x: 8, y: -2 },
                    Torso: { rot: 0, x: 0, y: 0 },
                    LLeg: { rot: -30, x: 10, y: 37 },
                    RLeg: { rot: 30, x: -10, y: 37 },
                    Face: "PrefferedSide"
                },
                {
                    Head: { rot: 0, x: 0, y: -20 },
                    LArm: { rot: 40, x: -10, y: -4 },
                    RArm: { rot: -40, x: 10, y: -4 },
                    Torso: { rot: 0, x: 0, y: 0 },
                    LLeg: { rot: -40, x: 13, y: 35 },
                    RLeg: { rot: 40, x: -13, y: 35 },
                    Face: "PrefferedSide"
                }
            ]
        };
        let WalkFrameOrder = [1, 2, 3, 2, 1, 0, 4, 5, 6, 5, 4, 0]
        let characterState = "Idle"
        let animframe = 0

        function getAnimationFrame() {
            const track = animationFrames[characterState];
            if (track && track[animframe]) {
                return track[animframe];
            }
            return null;
        }

        let PlrX = 960, PlrY = 540

        function drawCharacter(X, Y, Scale, Data, Mirror) {
            // Offsets so the position is top-left of the character instead of the feet
            X -= 10 * Scale;
            Y -= 80 * Scale;

            // Multiplier: 1 for normal rendering, -1 to invert horizontal properties
            const flipX = Mirror ? -1 : 1;

            // Left arm
            drawRotatedRectangle(
                X + (Data.LArm.x * Scale * flipX),
                Y + (Data.LArm.y * Scale),
                Scale * 20,
                Scale * 40,
                Data.LArm.rot * flipX,
                DarkenHex(Mirror ? config.RArmCol : config.LArmCol)
            );
            // Left leg
            drawRotatedRectangle(
                X + (Data.LLeg.x * Scale * flipX),
                Y + (Data.LLeg.y * Scale),
                Scale * 20,
                Scale * 40,
                Data.LLeg.rot * flipX,
                DarkenHex(Mirror ? config.RLegCol : config.LLegCol)
            );

            // Head
            drawRotatedRoundedRectangle(
                X + (Data.Head.x * Scale * flipX),
                Y + (Data.Head.y * Scale),
                Scale * 20,
                Scale * 20,
                Scale * 5,
                Data.Head.rot * flipX,
                config.HeadCol
            );

            //face
            let face = Data.Face
            if (face == "PrefferedSide") {
                face = config.Face + "Side"
            }

            const facetexture = faces[face];
            if (facetexture && facetexture.naturalWidth > 0) {
                // 1. Calculate how much to shrink the image to fit your original 20px target size
                const internalScale = 20 / facetexture.naturalWidth;

                // 2. Multiply by your global character Scale setting
                const finalFaceScale = Scale * internalScale;

                drawComplexImage(
                    facetexture,
                    X + (Data.Head.x * Scale * flipX),
                    Y + (Data.Head.y * Scale),
                    finalFaceScale,
                    Data.Head.rot * flipX,
                    Mirror
                );
            }

            // Right leg
            drawRotatedRectangle(
                X + (Data.RLeg.x * Scale * flipX),
                Y + (Data.RLeg.y * Scale),
                Scale * 20,
                Scale * 40,
                Data.RLeg.rot * flipX,
                Mirror ? config.LLegCol : config.RLegCol
            );

            // Torso
            drawRotatedRectangle(
                X + (Data.Torso.x * Scale * flipX),
                Y + (Data.Torso.y * Scale),
                Scale * 20,
                Scale * 40,
                Data.Torso.rot * flipX,
                config.TorsoCol
            );

            // Right arm
            drawRotatedRectangle(
                X + (Data.RArm.x * Scale * flipX),
                Y + (Data.RArm.y * Scale),
                Scale * 20,
                Scale * 40,
                Data.RArm.rot * flipX,
                Mirror ? config.LArmCol : config.RArmCol
            );
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(value, max));
        }

        let gamedata = {
            "1": {
                floor: 940,
                width: 1920,
                startposx: 90,
                startposy: 940,
                Size: 2.5,
            }
        }

        let EscapeMenuOpen = false

        //click detection
        canvas.addEventListener("click", (event) => {
            if (MouseHover === null) {
                EscapeMenuOpen = false
            }
            if (MouseHover == "Logo") {
                window.open("https://github.com/taxiePurrs/BobloxJs", '_blank').focus();
            } else if (MouseHover == "Tycoonicon") {
                Currentgame = 1
            } else if (MouseHover == "OpenEscape") {
                EscapeMenuOpen = !EscapeMenuOpen
            }
        })

        //initialize variables for game loop

        let escapemenuY = 1920
        let Currentgame = 0
        let prevgame = 0
        let animationClock = 0
        let facingleft = false
        let lastTime = 0
        let yvel = 0
        let Scrollx = 0
        let GameDataLoaded = null
        let speed = 150
        let Size = 2.5
        let jumppower = 1000
        let menu = 0

        let lastNetworkTick = 0;
        const NETWORK_TICK_RATE = 100

        const walkanimspeed = 6

        // Grab UI elements
        const btnCreateRoom = document.getElementById('btn-create-room');
        const btnJoinRoom = document.getElementById('btn-join-room');
        const inputRoomCode = document.getElementById('input-room-code');
        const displayRoomCode = document.getElementById('display-room-code');
        const txtRoomCode = document.getElementById('txt-room-code');

        // Matchmaking State variables
        let isLobbyHost = false;
        let connectedPeersList = [];

        // 1. ACTION: Host a New Lobby Room
        btnCreateRoom.onclick = function () {
            if (!window.cldelta.isOnline) {
                console.log("Cannot host: You are completely offline.");
                return;
            }

            // Force your generated UUID to act directly as the Room Code string
            // This uses the active registration ID we got from the matchmaker server
            const myLobbyCode = window.cldelta.name;

            isLobbyHost = true;
            Currentgame = myLobbyCode; // Assigns your global game variable context

            // Update the layout view
            txtRoomCode.innerText = myLobbyCode;
            displayRoomCode.style.display = "block";

            console.log("Lobby hosted. Tell your classmate to type code: " + myLobbyCode);
        };

        // 2. ACTION: Join an existing Friend's Lobby Room
        btnJoinRoom.onclick = function () {
            const targetCode = inputRoomCode.value.trim();

            if (targetCode === "") {
                console.log("Please input a valid room code.");
                return;
            }

            if (targetCode === window.cldelta.name) {
                console.log("You cannot matchmake or connect with yourself!");
                return;
            }

            console.log("Searching matchmaker servers for room code: " + targetCode);

            // Direct P2P tunnel initialization request via CloudLink API layers
            isLobbyHost = false;
            Currentgame = targetCode; // Sync your game room variable context to their room ID

            window.cldelta.connectToPeer(targetCode);
        };

        // 3. HANDSHAKE: Ensure clients pass network pipelines to other arrivals
        window.onPeerLinked = function (remotePlayerId) {
            console.log("[NETWORK] Connected to player: " + remotePlayerId);

            // Keep track of who is in our engine cluster
            if (!connectedPeersList.includes(remotePlayerId)) {
                connectedPeersList.push(remotePlayerId);
            }

            // CRITICAL MATCHMAKING HANDSHAKE STEP:
            // If you are the Host, and a second client joins, tell them about everyone else in the room
            // This forces all arriving players to link together automatically!
            if (isLobbyHost) {
                window.cldelta.sendPrivate(remotePlayerId, {
                    type: "ROOM_SYNC",
                    peers: connectedPeersList
                });
            }
        };

        // 4. ROUTER: Parse matchmaking management instructions 
        // Add this condition directly inside your existing window.routeIncomingGameData function
        const originalRouteHandler = window.routeIncomingGameData;
        window.routeIncomingGameData = function (payload) {
            // Run your existing frame movement tracking loops first
            if (typeof originalRouteHandler === 'function') {
                originalRouteHandler(payload);
            }

            const packet = payload.data;

            // Intercept automatic lobby routing updates sent by the host
            if (packet.type === "ROOM_SYNC" && !isLobbyHost) {
                console.log("Received room cluster updates from Lobby Host.");

                // Loop through all existing players in the match and bind to them
                packet.peers.forEach(peerId => {
                    if (peerId !== window.cldelta.name && !connectedPeersList.includes(peerId)) {
                        console.log("Auto-linking to peer member: " + peerId);
                        window.cldelta.connectToPeer(peerId);
                        connectedPeersList.push(peerId);
                    }
                });
            }
        };


        //some HomeMenu Textures and assets
        let tycoonico = new Image()
        loadImage(tycoonico, "TycoonIcon.png")

        function gameLoop(currentTime) {
            let dt = (currentTime - lastTime) / 1000;
            if (Number.isNaN(dt) || dt > 0.1) dt = 0;
            lastTime = currentTime;
            //set reset hovering id
            MouseHover = null
            let leftrightbias = 0

            animationClock = Math.max(animationClock - dt * ((characterState == "Walking") ? (speed / 50) : 1), 0)

            escapemenuY += dt * 4000 * (EscapeMenuOpen ? -1 : 1)
            escapemenuY = clamp(escapemenuY, 120, 1920)

            //clear the canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawRectangle(0, 0, canvas.width, canvas.height, "#111")

            //handle Key inputs


            if (Currentgame == 0) {
                PlrX = 123
                PlrY = 480
                Size = 3
                facingleft = false
                characterState = "Idle"
                animframe = 0
            } else {
                PlrY += yvel * dt
                if (keysdown.has("ArrowLeft")) { leftrightbias -= 1 }
                if (keysdown.has("a")) { leftrightbias -= 1 }
                if (keysdown.has("ArrowRight")) { leftrightbias += 1 }
                if (keysdown.has("d")) { leftrightbias += 1 }

                if (leftrightbias > 0) { facingleft = false }
                if (leftrightbias < 0) { facingleft = true }
                if (Currentgame != prevgame) {
                    GameDataLoaded = gamedata[String(Currentgame)]
                    PlrX = GameDataLoaded.startposx
                    PlrY = GameDataLoaded.startposy
                    yvel = 0
                    Scrollx = 0
                    Size = GameDataLoaded.Size
                }
                let movex = clamp(leftrightbias, -1, 1) * dt * speed * Size
                if (PlrY >= GameDataLoaded.floor) {
                    if (movex == 0) {
                        characterState = "Idle"
                        animframe = 0
                    } else {
                        if (characterState != "Walking") {
                            animframe = 0
                            animationClock = WalkFrameOrder.length / walkanimspeed
                        }
                        characterState = "Walking"//Change to walking when animation is present
                        if (animationClock == 0) {
                            animationClock = WalkFrameOrder.length / walkanimspeed
                        }
                        animframe = WalkFrameOrder[WalkFrameOrder.length - 1 - clamp(Math.floor(animationClock * walkanimspeed), 0, WalkFrameOrder.length - 1)]
                    }
                }
                if (GameDataLoaded.width - 1920 - Scrollx <= 0 && leftrightbias > 0) {
                    PlrX += movex
                }
                if (Scrollx <= 0 && leftrightbias < 0) {
                    PlrX += movex
                }
                if (PlrX < 10 * Size) {
                    PlrX = 10 * Size
                    if (PlrY >= GameDataLoaded.floor || characterState == "Walking") {
                        characterState = "Idle",
                            animframe = 0
                    }
                }
                if (PlrX > 1920 - 10 * Size) {
                    PlrX = 1920 - 10 * Size
                    if (PlrY >= GameDataLoaded.floor || characterState == "Walking") {
                        characterState = "Idle",
                            animframe = 0
                    }
                }
                if (PlrY >= GameDataLoaded.floor) {
                    yvel = 0
                    PlrY = GameDataLoaded.floor
                    if (keysdown.has("w") || keysdown.has("ArrowUp")) {
                        yvel = -Size * (jumppower / 2)
                        animationClock = 0.1
                        characterState = "Airborne"
                        animframe = 0
                    }
                } else {
                    characterState = "Airborne"
                    if (animationClock > 0) {
                        animframe = 0
                    } else {
                        animframe = 1 //change to 1 when fall animation is implemented
                    }
                    yvel += 1000 * Size * dt
                }


            }
            prevgame = Currentgame

            for (let id in remotePlayers) {
                let p = remotePlayers[id];

                if (Date.now() - p.lastUpdate > 5000) {
                    delete remotePlayers[id];
                    continue;
                }

                let renderX = p.x - Scrollx; // Subtracting YOUR local camera scroll value positions them perfectly
                let renderY = p.y;

                drawCharacter(renderX, renderY, p.s, p.state, p.m)
            }


            //Draw the character
            drawCharacter(PlrX, PlrY, Size, getAnimationFrame(), facingleft)


            if (Currentgame == 0) {
                EscapeMenuOpen = false
                escapemenuY = 1920
                //draw the overlaid boblox javascript edition logo
                ctx.drawImage(NotInGameOverlay, 0, 0)
                mouseHitbox(10, 10, 315, 94, "Logo") //clickbox redirects to github repo

                //draw games on home menu
                if (menu == 0) {
                    ctx.drawImage(tycoonico, 235, 120, 240, 240)
                    mouseHitbox(235, 120, 240, 240, "Tycoonicon")
                }
            } else {
                //draw the Boblox escape menu button
                drawRoundedRectangle(10, 10, 50, 50, 25, "#0009")
                circularMouseHitbox(30, 30, 25, "OpenEscape")
                //draw the escape menu
                if (escapemenuY < 1920) {
                    drawRoundedRectangle((canvas.width - 1280) / 2, escapemenuY, 1280, 840, 100, "#0009")
                    if (EscapeMenuOpen) {
                        MouseHover = null
                        mouseHitbox((canvas.width - 1280) / 2, escapemenuY, 1280, 840, "EscapeBackground")
                    }

                }
            }



            //draw the cursor
            drawCursor((MouseHover != null), mouseOnScreen)

            if (/*config.ShowFPS*/ true) {
                drawText(
                    Math.round(1 / dt) + " FPS",
                    0,
                    1060,
                    40,
                    "Arial",
                    "#fff"
                )
            }
            if (window.cldelta.isOnline && (currentTime - lastNetworkTick >= NETWORK_TICK_RATE)) {

                // Ensure state is just a simple number or text name string, not a complex object
                let currentAnimState = typeof getAnimationFrame === 'function' ? getAnimationFrame() : 0;

                window.cldelta.broadcast({
                    type: "LIVEDATA",
                    x: PlrX,
                    y: PlrY,
                    g: Currentgame,
                    sx: Scrollx,
                    s: Size,
                    m: facingleft,
                    state: currentAnimState
                });

                lastNetworkTick = currentTime; // Update the network clock gate timer
            }

            lasttime = currentTime
            requestAnimationFrame(gameLoop); //request next frame
        }

        requestAnimationFrame(gameLoop); //start the game loop
    </script>
</body>
