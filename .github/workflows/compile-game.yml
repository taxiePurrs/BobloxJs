name: Compile and Deploy BobloxJs Single File Game

on:
  push:
    branches:
      - main # Change this to 'master' if your default branch name is master

# Grant permissions needed to publish to GitHub Pages
permissions:
  pages: write
  id-token: write

# Prevent concurrent deployments from clashing
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Compile HTML and PNGs
      run: |
        chmod +x build.sh
        ./build.sh

    # 1. Prepare the dist folder as a web server artifact
    - name: Upload Static Webpage Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'dist/' # Points strictly to the folder containing your compiled index.html

    # 2. Push the artifact straight to your live github.io page
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
