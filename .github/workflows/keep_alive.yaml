name: Supabase Keep Alive Tracker

on:
  schedule:
    # Runs automatically every 3 days at midnight UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to manually trigger it from GitHub if needed

jobs:
  ping_db:
    runs-on: ubuntu-latest
    steps:
      - name: Send Authenticated REST Query to Postgres
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/active_servers?select=count" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
